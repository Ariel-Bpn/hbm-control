<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HBM Integrated Project Control System</title>
<meta name="theme-color" content="#0E2233">
<style>
/* ============================================================
   HBM IPCS — Design tokens
   Control-room palette: steel & navy body, amber for HBM face,
   olive for Site face. Numbers always tabular monospace.
   ============================================================ */
:root{
  --navy:#0E2233; --navy-2:#183349; --navy-3:#22455f;
  --steel:#EEF1F4; --line:#D3DAE1; --line-soft:#E4E9EE;
  --paper:#FFFFFF; --ink:#132433; --ink-2:#4A5D6E; --ink-3:#7A8B99;
  --amber:#D9902B; --amber-soft:#FBF1DF;
  --olive:#5C7A2E; --olive-soft:#EEF3E4;
  --teal:#0E6E6B; --teal-soft:#E1F0EF;
  --red:#B23A2F; --red-soft:#FAE9E7;
  --blue:#1F5C99; --blue-soft:#E7EFF7;
  --violet:#5B4B8A; --violet-soft:#EEEBF6;
  --r:8px; --r-s:5px;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --sh:0 1px 2px rgba(19,36,51,.07),0 4px 14px rgba(19,36,51,.05);
  --rail:var(--amber);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--steel); color:var(--ink);
  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--blue)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.tiny{font-size:11px}
.hide{display:none !important}
.right{text-align:right}.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}

/* ---------- LOGIN ---------- */
#login{
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(1100px 620px at 82% -8%,rgba(217,144,43,.22),transparent 62%),
    linear-gradient(180deg,#0B1B29,#0E2233 45%,#12293C);
}
.loginbox{width:100%;max-width:400px;background:var(--paper);border-radius:14px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.loginbox .brandline{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;margin-bottom:6px}
.loginbox .brandline .brandname{font-size:16px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pinpad button{padding:14px 0;font-size:18px;font-family:var(--mono);background:var(--steel);border:1px solid var(--line);border-radius:var(--r-s);cursor:pointer}
.pinpad button:active{background:var(--line-soft)}
.pindots{display:flex;gap:9px;justify-content:center;margin:14px 0 2px}
.pindots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pindots i.on{background:var(--navy)}

/* ---------- LOGO ---------- */
.logo{width:52px;height:52px;flex:0 0 auto;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--navy)}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.sm{width:44px;height:44px;border-radius:9px}
.logo.lg{width:88px;height:88px;border-radius:14px}
.logo.xl{width:130px;height:130px;border-radius:16px}
/* Logo unggahan mengikuti bentuk aslinya — logo memanjang tidak lagi dipaksa masuk kotak persegi.
   Alas putih dipakai agar tetap terbaca di kartu putih maupun sidebar gelap. */
.logo.custom{width:auto;height:auto;max-width:100%;background:#fff;padding:7px 10px;display:block}
.logo.custom img{width:auto;height:auto;max-width:100%;max-height:46px;margin:0 auto;object-fit:contain}
.logo.custom.sm img{max-height:42px}
.logo.custom.lg{padding:10px 14px}
.logo.custom.lg img{max-height:76px}
.logo.custom.xl{padding:12px 16px}
.logo.custom.xl img{max-height:112px}
@media(max-width:520px){.logo.lg{width:74px;height:74px}.logo.custom.lg img{max-height:62px}}
.brandname{font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.15}
.brandsub{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---------- SHELL ---------- */
#shell{display:none;min-height:100dvh;grid-template-columns:236px 1fr}
#shell.on{display:grid}
aside{background:var(--navy);color:#DCE6EE;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow:auto}
.asidehead{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;
  gap:9px;align-items:center;text-align:center}
.asidehead .logo{max-width:100%}
.asidehead .logo.custom{width:100%}
.asidehead .brandname{line-height:1.2}
.asidehead .brandname{color:#fff}
.asidehead .brandsub{color:#8AA2B5}
.facechip{margin:12px 12px 6px;padding:8px 10px;border-radius:var(--r-s);background:rgba(255,255,255,.06);border-left:3px solid var(--rail)}
.facechip b{display:block;font-size:12px;color:#fff}
.facechip span{font-size:10.5px;color:#93A8B9;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
nav{padding:8px 8px 16px;flex:1}
.navgrp{margin:12px 6px 5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7C93A6;font-weight:700}
nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);color:#C7D6E1;text-decoration:none;font-size:13.5px;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.on{background:var(--rail);color:#12222F;font-weight:700}
nav a .ic{width:18px;text-align:center;font-size:13px;opacity:.9}
nav a .cnt{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 7px;font-size:11px;font-family:var(--mono)}
nav a.on .cnt{background:rgba(0,0,0,.18)}
.asidefoot{padding:11px 12px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#8AA2B5}

main{min-width:0;display:flex;flex-direction:column}
header.top{
  background:var(--paper);border-bottom:1px solid var(--line);padding:11px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30
}
header.top .rail{width:4px;height:30px;border-radius:3px;background:var(--rail)}
header.top h1{font-size:16px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 9px;cursor:pointer}
.who{text-align:right;line-height:1.2}
.who b{font-size:12.5px;display:block}
.who span{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.content{padding:18px;max-width:1400px;width:100%}

/* ---------- CARDS / PANELS ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card>h3{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .body{padding:14px}
.card .body.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh);border-top:3px solid var(--navy-3)}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.kpi.amber{border-top-color:var(--amber)} .kpi.teal{border-top-color:var(--teal)}
.kpi.red{border-top-color:var(--red)} .kpi.blue{border-top-color:var(--blue)}
.kpi.olive{border-top-color:var(--olive)} .kpi.violet{border-top-color:var(--violet)}

/* ---------- TABLE ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#F7F9FB;white-space:nowrap
}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:#F9FBFC}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:30px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px;font-size:13px}

/* ---------- BADGES ---------- */
.b{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.b.gray{background:#EDF1F4;color:var(--ink-2);border-color:var(--line)}
.b.amber{background:var(--amber-soft);color:#8A5A0F;border-color:#EBD2A8}
.b.teal{background:var(--teal-soft);color:#0A5250;border-color:#B9DDDB}
.b.red{background:var(--red-soft);color:#8C271E;border-color:#EFC7C2}
.b.blue{background:var(--blue-soft);color:#194B7D;border-color:#C4D8EA}
.b.olive{background:var(--olive-soft);color:#41571F;border-color:#CFDDB6}
.b.violet{background:var(--violet-soft);color:#42356B;border-color:#D2CBE8}

/* ---------- FORMS ---------- */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
label.f>span em{color:var(--red);font-style:normal}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=time],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(34,69,95,.13)}
input[type=number]{font-family:var(--mono);text-align:right}
textarea{min-height:66px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#F2F5F7;color:var(--ink-2)}
.fg{display:grid;gap:0 12px}
.fg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.chk input{width:16px;height:16px}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#F5F8FA}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy-2)}
.btn.a{background:var(--amber);border-color:var(--amber);color:#2A1B04}
.btn.a:hover{filter:brightness(1.05)}
.btn.g{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--blue);padding:4px 6px;text-decoration:underline}

/* ---------- LINE ROWS (repeaters) ---------- */
.lines{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.lines .lh{background:#F7F9FB;padding:7px 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line)}
.line{padding:10px;border-bottom:1px solid var(--line-soft);display:grid;gap:0 10px;align-items:start}
.line:last-child{border-bottom:none}
.line .del{background:none;border:1px solid var(--line);color:var(--red);border-radius:var(--r-s);cursor:pointer;padding:6px 9px;height:34px;align-self:end;margin-bottom:11px}

/* ---------- ENTRY BLOCKS (baris tersusun ke bawah) ---------- */
.entry{border:1px solid var(--line);border-radius:var(--r-s);padding:11px;margin-bottom:10px;background:#FCFDFE}
.entry .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.entry .eh b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.entry label.f>span{color:var(--ink);font-size:11.5px}
.entry .btn.d{padding:4px 9px;font-size:11.5px}

/* ---------- PHOTOS ---------- */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
.ph{position:relative;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:#F2F5F7}
.ph img{width:100%;height:88px;object-fit:cover;display:block}
.ph .cap{padding:5px 6px;font-size:10.5px;line-height:1.3}
.ph .dl{position:absolute;bottom:34px;right:4px;background:rgba(14,34,51,.9);color:#fff;border:none;border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;text-decoration:none}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(178,58,47,.94);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}
.ph .tag{position:absolute;top:4px;left:4px;background:rgba(14,34,51,.88);color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;text-transform:uppercase}

/* ---------- BAR CHART MENDATAR ---------- */
.hbar{display:grid;grid-template-columns:170px 1fr 46px;gap:9px;align-items:center;margin-bottom:7px;font-size:12.5px}
.hbar .t{background:var(--line-soft);border-radius:4px;height:16px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--navy-3)}
.hbar .t i.hi{background:var(--red)}
.hbar .v{text-align:right;font-family:var(--mono);font-size:12px}
@media(max-width:520px){.hbar{grid-template-columns:110px 1fr 38px;font-size:11.5px}}

/* ---------- MODAL / TOAST ---------- */
#mask{position:fixed;inset:0;background:rgba(11,22,34,.55);display:none;z-index:100;padding:18px;overflow:auto}
#mask.on{display:block}
.modal{background:var(--paper);border-radius:11px;max-width:760px;margin:24px auto;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.modal>h3{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.modal .mbody{padding:16px;max-height:66vh;overflow:auto}
.modal .mfoot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{background:var(--navy);color:#fff;padding:10px 16px;border-radius:22px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.3);max-width:88vw}
.tt.err{background:var(--red)} .tt.ok{background:var(--teal)}

/* ---------- MISC ---------- */
.bar{height:7px;background:var(--line-soft);border-radius:20px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar i.w{background:var(--amber)} .bar i.c{background:var(--red)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 14px;background:#F7F9FB;border-radius:var(--r) var(--r) 0 0}
.tabs button{border:none;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--rail)}
.note{background:var(--blue-soft);border:1px solid #C4D8EA;border-left:3px solid var(--blue);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:#1B3E60}
.note.warn{background:var(--amber-soft);border-color:#EBD2A8;border-left-color:var(--amber);color:#7A4E0C}
.note.stop{background:var(--red-soft);border-color:#EFC7C2;border-left-color:var(--red);color:#8C271E}
.gate{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.gate span{padding:3px 8px;border-radius:4px;background:#EDF1F4;color:var(--ink-3);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.gate span.on{background:var(--navy);color:#fff}
.gate i{color:var(--ink-3);font-style:normal}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label.f{margin-bottom:0;min-width:130px}
.stack{display:flex;flex-direction:column;gap:2px}

/* ---------- PRINT ---------- */
@media print{
  aside,header.top,.noprint{display:none !important}
  #shell{display:block !important}
  body{background:#fff;font-size:11.5px}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  #mask{position:static;background:none;padding:0;display:block}
  #mask:not(.on){display:none}
  .modal{box-shadow:none;margin:0;max-width:none}
  .modal .mbody{max-height:none;overflow:visible}
  .mfoot,.modal>h3 button{display:none !important}
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:860px){
  #shell{grid-template-columns:1fr}
  aside{position:fixed;z-index:60;width:250px;left:-260px;transition:left .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
  aside.open{left:0}
  .burger{display:inline-flex}
  .content{padding:12px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fg.c2,.fg.c3,.fg.c4{grid-template-columns:1fr}
  header.top h1{font-size:14px}
  .who b{font-size:11.5px}
}
@media(max-width:520px){
  .kpi .v{font-size:20px}
  .modal .mbody{max-height:70vh}
}
.ujirow{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.ujirow:last-child{border-bottom:0}
.ujiik{flex:0 0 18px;text-align:center;font-weight:800;font-size:14px;line-height:1.45}
.ujirow b{font-size:13px;display:block;color:var(--ink)}
.ujiket{font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:2px;word-break:break-word}
.ujibar{height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:0 0 10px}
.ujibar i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}.sidesync{display:block;padding:8px 10px;border-radius:var(--r-s);background:rgba(255,255,255,.06);border-left:3px solid #8AA2B5;cursor:pointer}
.sidesync b{display:block;font-size:11.5px;color:#EAF0F5;letter-spacing:.02em}
.sidesync span{display:block;font-size:10px;color:#8AA2B5;margin-top:1px}
.sidesync.hijau{border-left-color:#4CAF93}
.sidesync.kuning{border-left-color:var(--amber);background:rgba(217,144,43,.16)}
.sidesync.kuning b{color:#F6D9A8}
.sidesync.merah{border-left-color:var(--red);background:rgba(178,58,47,.2)}
.sidesync.merah b{color:#F3BDB6}
.btn.danger{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.btn.danger:hover{background:var(--red);color:#fff}
.mfoot .btn.danger{margin-right:auto}

</style>
</head>
<body>
<!-- ======================= LOGIN ======================= -->
<div id="login">
  <div class="loginbox">
    <div class="brandline">
      <div class="logo lg" id="loginLogo"></div>
      <div>
        <div class="brandname">PT. HUDAYA BAYANAKA MANDIRI</div>
        <div class="brandsub">Integrated Project Control</div>
      </div>
    </div>
    <p class="small muted" style="margin:10px 0 14px">Pekerjaan Pengecatan Tanki — Area Oil Movement RU V Balikpapan</p>

    <label class="f"><span>PIN</span>
      <input type="password" id="lgPin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">

    DRT: nz(rf.DRT) > 0 ? nz(rf.DRT) : 1.12
  };

  DB.meta.version = "2.1";

/* Naik dari rantai lama (WO terbitan HBM) ke rantai baru
   SPK Pertamina > BAMK ke pelaksana > eksekusi.
   Tidak ada data yang dibuang: baris WO lama menjadi baris BAMK dengan
   nomor yang sama, dan seluruh laporan harian tetap menempel padanya. */
function migrasiSPK() {
  /* Tabel WO lama bernama "wos"; pindahkan isinya apa adanya. */
  if (Array.isArray(DB.wos) && !Array.isArray(DB.bamk)) DB.bamk = DB.wos;
  delete DB.wos;
  DB.bamk = DB.bamk || [];
  DB.spk = DB.spk || [];
  DB.spk_item = DB.spk_item || [];

  /* Tahapan: kalau belum ada, pasang tiga tahap bawaan. */
  if (!Array.isArray(DB.stages) || !DB.stages.length) {
    DB.stages = TAHAP_BAWAAN.map((x, n) => ({
      stage_id: "ST-" + String(n + 1).padStart(2, "0"), stage_code: x[0], stage_name: x[1],
      weight_pct: x[2], sort_order: n + 1, active: true
    }));
  }

  /* Kolom baru pada BAMK. Kunci lama wo_id sudah diganti bamk_id di seluruh
     tabel anak; baris lama yang masih memakai wo_id disalin ke sini. */
  /* Migrasi berjalan sebelum sebagian besar fungsi bantu sempat terbentuk,
     jadi hitungan luas di sini sengaja berdiri sendiri dan tidak memanggil
     luasTanki() atau volDariTanki(). */
  const rf = DB.config.roof_factor || { CRT: 1.05, FRT: 1.00, DRT: 1.12 };
  const accP = DB.config.acc_pct == null ? 10 : nz(DB.config.acc_pct);
  const luasLokal = tank_id => {
    const t = (DB.tanks || []).filter(x => x.tank_id === tank_id)[0];
    if (!t) return null;
    const D = nz(t.shell_diameter_m), H = nz(t.tank_height_m);
    if (D <= 0 || H <= 0) return null;
    const shell = Math.PI * D * H;
    const atap = 0.25 * Math.PI * D * D * (nz(rf[t.tank_type]) > 0 ? nz(rf[t.tank_type]) : 1);
    return { shell: shell, roof: atap, acc: (shell + atap) * accP / 100 };
  };

  const petaStatus = { ISSUED: "AKTIF", DRAFT: "DRAFT", CLOSED: "DITUTUP", CANCELLED: "BATAL" };
  DB.bamk.forEach(b => {
    if (!b.bamk_id && b.wo_id) { b.bamk_id = b.wo_id; delete b.wo_id; }
    if (!b.bamk_no && b.wo_no) { b.bamk_no = b.wo_no; delete b.wo_no; }
    if (petaStatus[b.status]) b.status = petaStatus[b.status];
    if (STATUS_BAMK.indexOf(b.status) < 0) b.status = "DRAFT";
    b.spk_id = b.spk_id || "";
    b.bamk_date = b.bamk_date || b.issue_date || "";
    /* Volume per bagian: kalau belum diisi, ambil dari hitungan luas
       eksterior tanki supaya angkanya tidak nol saat pertama dibuka. */
    if (b.vol_shell == null && b.vol_acc == null && b.vol_roof == null) {
      const v = luasLokal(b.tank_id);
      if (v) { b.vol_shell = +v.shell.toFixed(2); b.vol_acc = +v.acc.toFixed(2); b.vol_roof = +v.roof.toFixed(2); }
    }
    b.vol_shell = nz(b.vol_shell); b.vol_acc = nz(b.vol_acc); b.vol_roof = nz(b.vol_roof);
    if (b.bakp_qty == null) b.bakp_qty = 0;
    b.scan_url = b.scan_url || "";
    b.approved_qty = b.vol_shell + b.vol_acc + b.vol_roof;
    /* BAMK warisan belum punya SPK induk, jadi tidak boleh langsung aktif
       di lapangan — diturunkan ke DRAFT sampai SPK-nya dimasukkan. */
    if (b.status === "AKTIF" && !b.spk_id) { b.status = "DRAFT"; b.perlu_spk = true; }
  });

  /* Baris progress lama belum punya bagian dan tahap. Diberi nilai awal
     Shell + tahap pertama supaya tetap terbaca, dan ditandai agar
     Project Control tahu baris mana yang perlu ditinjau. */
  const t1 = (DB.stages[0] || {}).stage_id || "";
  DB.progress.forEach(p => {
    if (!p.part) { p.part = "SHELL"; p.perlu_tinjau = true; }
    if (!p.stage_id) { p.stage_id = t1; p.perlu_tinjau = true; }
  });

  /* Kunci tabel anak yang masih memakai nama lama. */
  ["scopes", "targets", "dailies", "progress", "manpower", "materials", "photos", "qc",
    "hsse", "issues", "verifications", "acceptances", "billables", "billings", "documents"]
    .forEach(t => (DB[t] || []).forEach(r => {
      if (r.bamk_id == null && r.wo_id != null) { r.bamk_id = r.wo_id; delete r.wo_id; }
    }));

  if (!DB.config.target_basis) DB.config.target_basis = "KALENDER";
  if (!DB.config.party_two_name) DB.config.party_two_name = "PT. PALDA SOLUSI SINERGI";
  if (!DB.config.pertamina_supervisor) DB.config.pertamina_supervisor = "Pengawas MA-4 PT Pertamina Patra Niaga RU V";
  if (DB.config.spk_alarm_h == null) DB.config.spk_alarm_h = 7;

  /* Shift dihapus: satu laporan per tanki per hari. Nilai lama disatukan
     supaya tidak ada lagi laporan kembar Pagi/Siang/Malam untuk tanggal sama. */
  DB.dailies.forEach(d => { if (!d.shift || ["Pagi", "Siang", "Malam"].indexOf(d.shift) >= 0) d.shift = "Harian"; });
  /* Tenaga kerja warisan belum menyebut pihak — dikosongkan agar tampak dan
     bisa dilengkapi, bukan ditebak sendiri oleh sistem. */
  DB.manpower.forEach(m => { if (m.pihak == null) m.pihak = ""; });
  DB.messages = DB.messages || [];
  /* Laporan yang sudah dikembalikan sebelum ada kode, diberi kode surut
     supaya Admin Site punya rujukan yang sama saat berkoordinasi. */
  DB.dailies.forEach(d => {
    if (d.status === "REJECTED" && !d.return_code) {

      d.return_code = "KMB-" + String(d.report_date || "").replace(/-/g, "").slice(2) +
        "-" + String((t && t.tank_no) || "?").replace(/[^A-Za-z0-9]/g, "") +
        "-R" + (nz(d.revision_no) || 1);

  });

/* ============================================================
   LUAS PENGECATAN EKSTERIOR TANKI
   Mengikuti lembar "Perhitungan Luas Pengecatan Tangki — Basis Eksterior".

     Shell luar    = pi x D x H
     Atap          = 1/4 x pi x D^2 x faktor atap
     Perlengkapan  = (shell + atap) x allowance persen
     TOTAL         = shell + atap + perlengkapan

   Faktor atap bawaan: CRT (cone) 1,05 · FRT (floating) 1,00 · DRT (dome) 1,12.
   Perlengkapan mencakup handrail, tangga, pipa FW, foam chamber, water drencher.
   ============================================================ */

/* Membuat daftar pilihan untuk sebuah kolom ketik. Isinya gabungan daftar
   bawaan dengan nilai yang sudah pernah dipakai, supaya istilah yang sudah
   terlanjur dipakai di lapangan ikut tertawarkan. */
function daftarPilihan(idDaftar, bawaan, terpakai) {
  const semua = [];
  (bawaan || []).concat(terpakai || []).forEach(v => {
    const t = String(v == null ? "" : v).trim();
    if (t && semua.indexOf(t) < 0) semua.push(t);
  });

}

const TANK_TYPES = [
  { k: "CRT", t: "CRT — cone roof" },
  { k: "FRT", t: "FRT — floating roof" },
  { k: "DRT", t: "DRT — dome roof" }
];
const ROOF_BAWAAN = { CRT: 1.05, FRT: 1.00, DRT: 1.12 };

function faktorAtap(tipe) {
  const f = (DB.config && DB.config.roof_factor) || {};
  const v = nz(f[tipe]);
  return v > 0 ? v : (ROOF_BAWAAN[tipe] || 1);
}
function accPersen() {
  const v = DB.config && DB.config.acc_pct;
  return v == null ? 10 : nz(v);
}
/* Mengembalikan rincian luas, atau null bila diameter/tinggi belum diisi. */
function luasEksterior(tipe, D, H) {
  D = nz(D); H = nz(H);
  if (D <= 0 || H <= 0) return null;
  const shell = Math.PI * D * H;
  const atap = 0.25 * Math.PI * D * D * faktorAtap(tipe);
  const acc = (shell + atap) * (accPersen() / 100);
  return { shell: shell, atap: atap, jumlah: shell + atap, acc: acc, total: shell + atap + acc };
}
function luasTanki(t) { return t ? luasEksterior(t.tank_type, t.shell_diameter_m, t.tank_height_m) : null; }
function totalLuasEksterior() {
  return DB.tanks.reduce((a, t) => { const L = luasTanki(t); return a + (L ? L.total : 0); }, 0);
}

  bamk: "bamk_id", stages: "stage_id", scopes: "scope_id", targets: "target_id",

/* Sidik jari isi satu baris, dipakai untuk mengenali baris mana yang berubah. */
function sidikBaris(r) {
  let s = "";
  for (const k in r) {
    if (k === "_ts") continue;
    const v = r[k];
    s += k + "=" + (typeof v === "string" && v.length > 200 ? v.length + ":" + v.slice(0, 40) : v) + ";";
  }
  return s;
}
/* Baris yang isinya berubah diberi penanda waktu baru, sehingga saat digabung
   di server versi terbarulah yang menang. Baris yang tidak disentuh tidak ikut berubah. */
function tandaiPerubahan() {
  SYNC_TABLES.forEach(t => {
    const belumAda = !SIG[t];
    const arr = DB[t] || [], cache = SIG[t] || (SIG[t] = {}), ada = {};
    arr.forEach(r => {
      const k = r[SYNC_KEY[t]]; if (!k) return;
      ada[k] = 1;
      const s = sidikBaris(r);
      /* Saat sidik pertama kali dibangun, isi yang ada belum tentu perubahan —
         cukup dicatat apa adanya tanpa memperbarui penanda waktu. */
      if (belumAda) { cache[k] = s; return; }
      if (cache[k] !== s) { r._ts = Date.now(); cache[k] = s; }
    });
    Object.keys(cache).forEach(k => { if (!ada[k]) delete cache[k]; });
  });
}
/* Isi sidik jari tanpa mengubah penanda waktu — dipakai sesudah menarik data
   dari server, agar data lama tidak terhitung sebagai perubahan baru. */
function bangunSidik() {
  SYNC_TABLES.forEach(t => {
    const cache = SIG[t] = {};
    (DB[t] || []).forEach(r => { const k = r[SYNC_KEY[t]]; if (k) cache[k] = sidikBaris(r); });
  });
}

/* ---------- BAMK: VOLUME PER BAGIAN ---------- */
function volBagian(b, part) {

/* Volume yang dipakai untuk tagihan: BAKP kalau sudah ada, kalau belum BAMK. */
function volTagih(b) { return b ? (nz(b.bakp_qty) > 0 ? nz(b.bakp_qty) : volBamk(b)) : 0; }

/* ---------- TARGET HARIAN DARI SPK ---------- */
/* Jumlah hari rencana satu BAMK menurut dasar yang dipilih di Pengaturan. */
function hariRencana(b) {
  if (!b) return 0;
  const sp = spkOf(b.spk_id);
  const mulai = (sp && sp.start_date) || b.planned_start;
  const akhir = (sp && sp.finish_date) || b.planned_finish;
  if (!mulai || !akhir) return 0;
  const a = new Date(mulai + "T00:00:00"), z = new Date(akhir + "T00:00:00");
  if (z < a) return 0;
  const dasar = DB.config.target_basis || "KALENDER";
  const hol = new Set(DB.config.holidays || []);
  let n = 0, c = new Date(a);
  while (c <= z) {
    const dw = c.getDay(), iso = c.toISOString().slice(0, 10);
    if (dasar === "KALENDER") n++;
    else if (dasar === "KERJA") { if (dw !== 0) n++; }
    else { if (dw !== 0 && !hol.has(iso)) n++; }
    c.setDate(c.getDate() + 1);
  }
  return n;
}

/* Logo disimpan sebagai PNG agar latar tembus pandang tidak berubah jadi hitam. */
function shrinkLogo(file, cb) {
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/png"));
    };
    img.onerror = () => toast("Berkas logo tidak terbaca.", "err");
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}

function periodSeries() {
  const set = new Set();
  DB.targets.forEach(t => set.add(t.period));
  DB.verifications.forEach(v => set.add(monthOf(v.verified_date)));
  DB.dailies.forEach(d => set.add(monthOf(d.report_date)));
  /* Jendela waktu setiap SPK ikut membentuk sumbu periode, supaya garis
     rencana terilis tetap terlihat walau belum ada realisasi sama sekali. */
  DB.spk.filter(x => x.status === "TERBIT" || x.status === "SELESAI").forEach(x => {
    if (x.start_date) set.add(monthOf(x.start_date));
    if (x.finish_date) set.add(monthOf(x.finish_date));
  });
  if (!set.size) set.add(monthOf(today()));
  const per = Array.from(set).sort();
  const pagu = totalLuasEksterior();
  let cp = 0, ca = 0;
  return per.map(p => {
    cp += DB.targets.filter(t => t.period === p).reduce((a, t) => a + nz(t.planned_qty), 0);
    ca += DB.verifications.filter(v => v.status === "VERIFIED" && monthOf(v.verified_date) === p)
      .reduce((a, v) => a + nz(v.verified_qty), 0);
    return { p, plan: cp, act: ca, rilis: rencanaTerilis(p), pagu: pagu };
  });
}

/* Rencana terilis: volume seluruh BAMK yang SPK-nya sudah terbit, disebar
   rata sepanjang jangka waktu SPK masing-masing, dikumulatifkan sampai
   akhir bulan yang diminta. Setiap SPK baru menambah garis ini sendiri —
   itulah sebabnya rencana bersifat bergulir, bukan satu garis tetap. */
function rencanaTerilis(periode) {
  const akhirBulan = (() => {
    const [y, m] = periode.split("-").map(Number);
    return new Date(y, m, 0).toISOString().slice(0, 10);
  })();
  let total = 0;
  DB.bamk.forEach(b => {
    const sp = spkOf(b.spk_id);
    if (!sp || (sp.status !== "TERBIT" && sp.status !== "SELESAI")) return;
    const vol = volBamk(b);
    if (vol <= 0 || !sp.start_date || !sp.finish_date) return;
    if (akhirBulan < sp.start_date) return;
    if (akhirBulan >= sp.finish_date) { total += vol; return; }
    const hariTotal = Math.max(1, Math.round((new Date(sp.finish_date + "T00:00:00") - new Date(sp.start_date + "T00:00:00")) / 86400000) + 1);
    const hariLewat = Math.round((new Date(akhirBulan + "T00:00:00") - new Date(sp.start_date + "T00:00:00")) / 86400000) + 1;
    total += vol * Math.min(1, Math.max(0, hariLewat / hariTotal));
  });
  return total;
}

function svgCurve(rows) {
  if (rows.length < 1) return `<div class="empty">Belum ada data kurva.</div>`;
  const W = 700, H = 240, pl = 52, pr = 14, pt = 14, pb = 30;
  const max = Math.max(1, ...rows.map(r => Math.max(r.plan, r.act, r.rilis, r.pagu)));
  const x = i => pl + (rows.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (rows.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const line = k => rows.map((r, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(r[k]).toFixed(1)).join(" ");
  const dots = (k, c) => rows.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r[k]).toFixed(1)}" r="3" fill="${c}"/>`).join("");
  const grid = [0, .25, .5, .75, 1].map(f => {
    const yy = pt + (H - pt - pb) * (1 - f);
    return `<line x1="${pl}" y1="${yy}" x2="${W - pr}" y2="${yy}" stroke="#E4E9EE"/>
            <text x="${pl - 6}" y="${yy + 4}" font-size="9" fill="#7A8B99" text-anchor="end">${fmt0(max * f)}</text>`;
  }).join("");
  const labs = rows.map((r, i) => rows.length > 8 && i % 2 ? "" :
    `<text x="${x(i).toFixed(1)}" y="${H - 9}" font-size="9" fill="#7A8B99" text-anchor="middle">${r.p.slice(2)}</text>`).join("");
  const adaPagu = rows[0].pagu > 0;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${labs}
    ${adaPagu ? `<path d="${line("pagu")}" fill="none" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="2 4"/>` : ""}
    <path d="${line("plan")}" fill="none" stroke="#1F5C99" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${line("rilis")}" fill="none" stroke="#B5761F" stroke-width="2.5"/>
    <path d="${line("act")}" fill="none" stroke="#0E6E6B" stroke-width="2.5"/>
    ${dots("rilis", "#B5761F")}${dots("act", "#0E6E6B")}</svg>
    <div class="row tiny muted mt8">
      ${adaPagu ? `<span style="color:#9AA7B2">▬ Pagu kontrak (13 tanki)</span>` : ""}
      <span style="color:#1F5C99">▬ Rencana kontrak (target plan)</span>
      <span style="color:#B5761F">▬ Rencana terilis (SPK)</span>
      <span style="color:#0E6E6B">▬ Terverifikasi kumulatif</span></div>
    <div class="tiny muted mt8">Garis <b>rencana terilis</b> hanya memuat tanki yang SPK-nya sudah terbit dan sudah ber-BAMK,
      disebar rata sepanjang jangka waktu tiap SPK. Selisihnya terhadap pagu kontrak adalah bagian program yang
      belum diperintahkan Pertamina — bukan keterlambatan pelaksana.</div>`;
}

const BACA_KEY = "HBM_IPCS_BACA";

  try { return JSON.parse(localStorage.getItem(BACA_KEY) || "{}"); } catch (e) { return {}; }
}

   bergantian, dan pesan yang sudah dibaca satu orang tidak berarti sudah
   dibaca orang berikutnya. */

  const u = (S.user || {}).user_id || "-";

function tandaiBaca(kanal) {
  const u = (S.user || {}).user_id || "-";
  const semua = semuaBaca();
  semua[u] = semua[u] || {};
  semua[u][kanal] = new Date().toISOString();

        <div class="body"><div id="mtList"></div></div></div>
    </div>

    <div class="card"><h3>5 · Foto bukti <span class="tiny muted">Before · Kegiatan · After · QC/HSSE</span></h3><div class="body">
      <div class="row">
        <label class="f" style="min-width:170px;margin-bottom:0"><span>Jenis foto</span>

    <div class="grid g2">
      <div class="card"><h3>6 · QC / Inspeksi</h3><div class="body">
        <div class="fg c2">
          <label class="f"><span>Jenis inspeksi</span><select id="qType">${listOpts(QC_TYPES, d.qc.inspection_type, "— tidak ada inspeksi —")}</select></label>

          <label class="f"><span>Nomor dokumen</span><input type="text" id="qRef" value="${esc(d.qc.reference_no)}"></label>

        <div class="chk"><input type="checkbox" id="qMa4" ${d.qc.ma4_known ? "checked" : ""}><label for="qMa4">Sudah diketahui ${esc(DB.config.pertamina_supervisor || "Pengawas Pertamina")}</label></div>
        <label class="f"><span>Tanggal diketahui</span><input type="date" id="qMa4d" value="${esc(d.qc.ma4_date || "")}"></label>
        <div class="tiny muted">SPK mensyaratkan seluruh hasil inspeksi dan rekomendasi diketahui pengawas Pertamina.
          Laporan dengan inspeksi yang belum diketahui tidak bisa lolos gerbang verifikasi.</div>
      </div></div>

      <div class="card"><h3>7 · HSSE</h3><div class="body">
        <div class="fg c2">
          <label class="f"><span>Status PTW / izin <em>*</em></span><select id="hPermit">${listOpts(["AKTIF", "TIDAK AKTIF", "DITUNDA"], d.hsse.permit_status, "—")}</select></label>
          <label class="f"><span>Toolbox meeting</span><select id="hTool">${listOpts(["SUDAH", "BELUM"], d.hsse.toolbox_status, "—")}</select></label>
          <label class="f"><span>Fit to work</span><select id="hFtw">${listOpts(["OK", "ADA CATATAN"], d.hsse.fit_to_work, "—")}</select></label>
          <label class="f"><span>Temuan kritis</span><input type="text" id="hCrit" value="${esc(d.hsse.critical_finding)}" placeholder="kosongkan bila nihil"></label>
        </div>
        <label class="f"><span>Catatan HSSE</span><input type="text" id="hRem" value="${esc(d.hsse.remarks)}"></label>
      </div></div>
    </div>

    <div class="card"><h3>8 · Kendala hari ini</h3><div class="body">
      <div class="fg c4">
        <label class="f"><span>Kategori</span><select id="iCat">${listOpts(["TEKNIS", "IZIN", "MATERIAL", "CUACA", "TENAGA KERJA", "PERALATAN", "LAINNYA"], d.issue.category, "Tidak ada kendala")}</select></label>
        <label class="f"><span>Dampak</span><input type="text" id="iImp" value="${esc(d.issue.impact)}" placeholder="mis. berhenti 3 jam"></label>
        <label class="f"><span>PIC dari pihak</span><select id="iSide">${listOpts(PIHAK, d.issue.owner_side, "—")}</select></label>
        <label class="f"><span>Nama PIC</span><input type="text" id="iOwn" value="${esc(d.issue.owner)}" placeholder="nama orang yang menangani"></label>
      </div>
      <div class="fg c2">
        <label class="f"><span>Uraian kendala</span><textarea id="iDesc">${esc(d.issue.description)}</textarea></label>
        <label class="f"><span>Tindakan</span><textarea id="iAct">${esc(d.issue.action)}</textarea></label>
      </div>
    </div></div>

    <div class="card"><h3>9 · Catatan umum</h3><div class="body">
      <div class="fg c2">
        <label class="f"><span>Catatan dibuat oleh</span><select id="dSupSide">${listOpts(PENGAWAS, d.supervisor_side)}</select></label>
        <label class="f"><span>Nama pengawas</span><input type="text" id="dSupName" value="${esc(d.supervisor_name)}" placeholder="nama pengawas yang bertanggung jawab"></label>
      </div>
      <label class="f"><span>Catatan pengawas</span><textarea id="dNotes" placeholder="Ringkasan kegiatan, koordinasi, rencana besok">${esc(d.general_notes)}</textarea></label>
      <div class="row mt12">
        <button class="btn" id="btnDraft">Simpan draft</button>
        <button class="btn p" id="btnSubmit">${d.status === "REJECTED" ? "Ajukan ulang" : "Ajukan laporan"}</button>
        <button class="btn" id="btnReset">Kosongkan</button>
      </div>
    </div></div>`;
  },
  bind() {
    $$("[data-fix]").forEach(b => b.onclick = () => loadDraft(b.dataset.fix));
    const d = S.draft; if (!d) return;
    const pull = () => {
      d.report_date = $("#dDate").value; d.bamk_id = $("#dWo").value;
      d.weather = $("#dWeather").value; d.general_notes = $("#dNotes").value;
      d.supervisor_side = $("#dSupSide").value; d.supervisor_name = $("#dSupName").value;
      d.qc = { inspection_type: $("#qType").value, result: $("#qRes").value, rework_required: $("#qRw").checked, reference_no: $("#qRef").value, remarks: $("#qRem").value, ma4_known: $("#qMa4").checked, ma4_date: $("#qMa4d").value };
      d.hsse = { permit_status: $("#hPermit").value, toolbox_status: $("#hTool").value, fit_to_work: $("#hFtw").value, critical_finding: $("#hCrit").value, remarks: $("#hRem").value };
      d.issue = { category: $("#iCat").value, description: $("#iDesc").value, impact: $("#iImp").value, action: $("#iAct").value, owner_side: $("#iSide").value, owner: $("#iOwn").value };
    };
    $("#dWo").onchange = () => { pull(); d.progress = []; render(); };

    /* --- progress: bagian + tahap, isi luas hari ini saja --- */
    const W = bamkOf(d.bamk_id);
    const TH = tahapAktif();

    /* Berapa yang sudah masuk sebelum laporan ini, per bagian per tahap. */
    const sudah = (part, stage_id) => kumulatif(d.bamk_id, part, stage_id, d.daily_id);
    /* Berapa yang sedang diisi di layar ini, tidak termasuk baris ke-i. */
    const diLayar = (part, stage_id, kecualiIdx) =>
      d.progress.reduce((a, p, n) => (n !== kecualiIdx && p.part === part && p.stage_id === stage_id)
        ? a + nz(p.actual_qty) : a, 0);
    const batas = (part, stage_id, idx) => {
      const kapasitas = volBagian(W, part);
      const sisaBagian = kapasitas - sudah(part, stage_id) - diLayar(part, stage_id, idx);
      const seb = tahapSebelum(stage_id);
      if (!seb) return Math.max(0, sisaBagian);
      /* Tahap ini tidak boleh melampaui tahap sebelumnya. */
      const atas = sudah(part, seb.stage_id) + diLayar(part, seb.stage_id, -1)
        - sudah(part, stage_id) - diLayar(part, stage_id, idx);
      return Math.max(0, Math.min(sisaBagian, atas));
    };

    /* Papan sisa: satu tabel kecil supaya lapangan tahu posisi tanpa buka laporan. */
    const drawSisa = () => {
      const kotak = $("#sisaBox"); if (!kotak || !W) return;
      kotak.innerHTML = `<div class="tw"><table><thead><tr><th>Bagian</th><th class="n">Volume</th>
        ${TH.map(t => `<th class="n">${esc(t.stage_name)}<div class="tiny muted">${fmt(t.weight_pct, 0)}%</div></th>`).join("")}</tr></thead>
        <tbody>${BAGIAN.map(b => {
        const kap = volBagian(W, b[0]);
        return `<tr><td><b>${esc(b[1])}</b></td><td class="n tiny">${fmt(kap, 2)}</td>
          ${TH.map(t => {
          const done = sudah(b[0], t.stage_id) + diLayar(b[0], t.stage_id, -1);
          const p = kap > 0 ? done / kap * 100 : 0;
          return `<td class="n tiny">${fmt(done, 1)}<div class="muted">${fmt(p, 0)}%</div></td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody>
        <tfoot><tr><th>Progress tanki</th><th class="n">${fmt(volBamk(W), 2)}</th>
          <th class="n" colspan="${TH.length}">${fmt(persenBamk(d.bamk_id), 1)}% terbobot</th></tr></tfoot></table></div>`;
    };

    /* Memperbarui keterangan batas satu baris tanpa menyentuh kotak isiannya,
       supaya kursor dan angka yang sedang diketik tidak hilang. */
    const segarkanBatas = (i) => {
      const el = $("#batas" + i); if (!el) return;
      const p = d.progress[i], maks = batas(p.part, p.stage_id, i);
      const lebih = nz(p.actual_qty) > maks + 0.005, seb = tahapSebelum(p.stage_id);
      el.className = "tiny " + (lebih ? "" : "muted");
      el.style.cssText = lebih ? "color:var(--red);font-weight:700" : "";
      el.innerHTML = (lebih ? "Melebihi batas. " : "") +
        "Maksimal yang masih boleh diisi di baris ini: <b>" + fmt(maks, 2) + " m²</b>. " +
        (seb ? "Dibatasi juga oleh tahap sebelumnya (" + esc(seb.stage_name) + ")." : "");
    };

    const drawProg = () => {
      $("#progList").innerHTML = d.progress.length ? d.progress.map((p, i) => {
        const maks = batas(p.part, p.stage_id, i);
        const lebih = nz(p.actual_qty) > maks + 0.005;
        const seb = tahapSebelum(p.stage_id);
        return `
        <div class="entry">
          <div class="eh"><b>Baris ${i + 1}</b><button class="btn d sm" data-dp="${i}">Hapus</button></div>
          <div class="fg c3">
            <label class="f"><span>Bagian <em>*</em></span><select data-p="part" data-i="${i}">
              ${BAGIAN.map(b => `<option value="${b[0]}" ${p.part === b[0] ? "selected" : ""}>${esc(b[1])} — ${fmt(volBagian(W, b[0]), 2)} m²</option>`).join("")}</select></label>
            <label class="f"><span>Tahap <em>*</em></span><select data-p="stage_id" data-i="${i}">
              ${TH.map(t => `<option value="${t.stage_id}" ${p.stage_id === t.stage_id ? "selected" : ""}>${esc(t.stage_name)}</option>`).join("")}</select></label>
            <label class="f"><span>Luas hari ini (m²) <em>*</em></span>
              <input type="text" inputmode="decimal" autocomplete="off" data-p="actual_qty" data-i="${i}"
                placeholder="mis. 9,34" value="${esc(String(p.actual_qty == null ? "" : p.actual_qty))}"></label>
          </div>
          <div class="tiny ${lebih ? "" : "muted"}" id="batas${i}" ${lebih ? `style="color:var(--red);font-weight:700"` : ""}>
            ${lebih ? `Melebihi batas. ` : ""}Maksimal yang masih boleh diisi di baris ini: <b>${fmt(maks, 2)} m²</b>.
            ${seb ? `Dibatasi juga oleh tahap sebelumnya (${esc(seb.stage_name)}).` : ""}
          </div>
          <label class="f mt8"><span>Aktivitas / keterangan</span><select data-p="activity" data-i="${i}">${listOpts(ACTIVITIES, p.activity, "— pilih aktivitas —")}</select></label>
          ${p.activity === "Lainnya" ? `<label class="f"><span>Sebutkan aktivitas</span><input type="text" data-p="activity_other" data-i="${i}" value="${esc(p.activity_other || "")}"></label>` : ""}
        </div>`;
      }).join("") : `<div class="empty"><b>Belum ada baris progress</b>Tekan “+ Tambah baris”, atau “Salin dari kemarin”.</div>`;

      $$("#progList [data-p]").forEach(el => el.oninput = () => {
        const i = +el.dataset.i, k = el.dataset.p;
        d.progress[i][k] = el.value;
        if (k === "actual_qty") {
          /* JANGAN menggambar ulang daftar di sini. Menggambar ulang akan
             mengganti kotak isian dengan yang baru di tengah orang mengetik,
             sehingga "9,34" terpotong menjadi "9" begitu titik ditekan.
             Cukup perbarui keterangan batas dan papan sisa saja. */
          segarkanBatas(i); drawSisa();
          return;
        }
        if (k === "part" || k === "stage_id") {
          const t = tahapOf(d.progress[i].stage_id);
          d.progress[i].work_package = (t ? t.stage_name : "") + " — " + bagianLabel(d.progress[i].part);
          d.progress[i].pct_complete = 0;
        }
        if (k === "part" || k === "stage_id" || k === "activity") { drawProg(); drawSisa(); }
      });
      /* Kotak luas sengaja bertipe teks, bukan number: papan tombol HP di
         Indonesia mengetik koma, dan kotak number membuang isinya sendiri saat
         titik desimal baru ditekan. Pembersihannya dilakukan di sini. */
      $$('#progList [data-p="actual_qty"]').forEach(el => el.onblur = () => {
        const i = +el.dataset.i;
        /* Ambil bilangan pertama saja, supaya ketikan seperti "12,5 m2"
           terbaca 12,5 dan bukan 12,52. */
        const cocok = String(el.value || "").replace(",", ".").match(/\d+(?:\.\d+)?/);
        const angka = cocok ? parseFloat(cocok[0]) : "";
        d.progress[i].actual_qty = angka;
        el.value = angka === "" ? "" : String(angka).replace(".", ",");
        segarkanBatas(i); drawSisa();
      });
      $$("#progList [data-dp]").forEach(b => b.onclick = () => { d.progress.splice(+b.dataset.dp, 1); drawProg(); drawSisa(); });
      drawSisa();
    };

    const barisBaru = (part, stage_id) => {
      const t = tahapOf(stage_id);
      return {
        part: part, stage_id: stage_id, scope_id: "", activity: "", activity_other: "",
        work_package: (t ? t.stage_name : "") + " — " + bagianLabel(part),
        target_qty: 0, actual_qty: 0, unit: "m2", pct_complete: 0
      };
    };
    $("#addProg").onclick = () => {
      d.progress.push(barisBaru("SHELL", (TH[0] || {}).stage_id || ""));
      drawProg();
    };
    /* Salin susunan baris laporan terakhir tanki ini — angkanya dikosongkan,
       supaya yang diketik ulang hanya luasannya. */
    $("#copyKemarin").onclick = () => {
      const lalu = DB.dailies.filter(x => x.bamk_id === d.bamk_id && x.daily_id !== d.daily_id)
        .slice().sort((a, b) => (b.report_date || "").localeCompare(a.report_date || ""))[0];
      if (!lalu) return toast("Belum ada laporan sebelumnya untuk tanki ini.", "err");
      const baris = DB.progress.filter(p => p.daily_id === lalu.daily_id);
      if (!baris.length) return toast("Laporan sebelumnya tidak punya baris progress.", "err");
      d.progress = baris.map(p => barisBaru(p.part || "SHELL", p.stage_id || (TH[0] || {}).stage_id || ""));
      drawProg();
      toast("Disalin dari laporan " + dateID(lalu.report_date) + ". Isi luasannya.", "ok");
    };
    drawProg();

    /* --- tenaga kerja --- */
    const drawMp = () => {
      $("#mpList").innerHTML = d.manpower.length ? d.manpower.map((m, i) => `
        <div class="entry"><div class="eh"><b>Tenaga ${i + 1}</b><button class="btn d sm" data-dm="${i}">Hapus</button></div>
          <div class="fg c2">
            <label class="f"><span>Pihak</span><select data-m="pihak" data-i="${i}">${listOpts(PIHAK_MP, m.pihak, "— pilih pihak —")}</select></label>
            <label class="f"><span>Kategori</span><select data-m="category" data-i="${i}">${listOpts(MANPOWER_CATS, m.category, "— pilih kategori —")}</select></label>
          </div>
          <div class="fg c2">
            <label class="f"><span>Orang</span><input type="number" min="0" data-m="worker_count" data-i="${i}" value="${m.worker_count}"></label>
            <label class="f"><span>Keterangan</span><input type="text" data-m="notes" data-i="${i}" value="${esc(m.notes || "")}"></label>
          </div></div>`).join("") : `<div class="empty">Belum ada data tenaga kerja.</div>`;
      $$("#mpList [data-m]").forEach(el => el.oninput = () => d.manpower[+el.dataset.i][el.dataset.m] = el.value);
      $$("#mpList [data-dm]").forEach(b => b.onclick = () => { d.manpower.splice(+b.dataset.dm, 1); drawMp(); });
    };
    $("#addMp").onclick = () => { d.manpower.push({ pihak: "", category: "", worker_count: 0, notes: "" }); drawMp(); };
    drawMp();

    /* --- material --- */
    const drawMt = () => {
      $("#mtList").innerHTML = d.materials.length ? d.materials.map((m, i) => `
        <div class="entry"><div class="eh"><b>Material ${i + 1}</b><button class="btn d sm" data-dt="${i}">Hapus</button></div>
          <label class="f"><span>Item</span><input type="text" data-t="item" data-i="${i}" value="${esc(m.item)}"></label>
          <div class="fg c3">
            <label class="f"><span>Jumlah</span><input type="number" step="any" min="0" data-t="qty" data-i="${i}" value="${m.qty}"></label>
            <label class="f"><span>Satuan</span><input type="text" data-t="unit" data-i="${i}" value="${esc(m.unit)}"></label>
            <label class="f"><span>No. DO</span><input type="text" data-t="do_no" data-i="${i}" value="${esc(m.do_no)}"></label>
          </div></div>`).join("") : `<div class="empty">Belum ada material tercatat.</div>`;
      $$("#mtList [data-t]").forEach(el => el.oninput = () => d.materials[+el.dataset.i][el.dataset.t] = el.value);
      $$("#mtList [data-dt]").forEach(b => b.onclick = () => { d.materials.splice(+b.dataset.dt, 1); drawMt(); });
    };
    $("#addMt").onclick = () => { d.materials.push({ item: "", qty: 0, unit: "", do_no: "", notes: "" }); drawMt(); };
    drawMt();

    /* --- foto --- */
    const drawPh = () => {
      $("#phList").innerHTML = d.photos.map((p, i) => `
        <div class="ph"><span class="tag">${esc(p.photo_type)}</span>
          <button class="x" data-dph="${i}">✕</button>
          <img src="${p.file_url}" alt="">
          <a class="dl" download="${esc(photoName(d, p, i))}" href="${p.file_url}">Unduh</a>
          <div class="cap">${esc(p.caption || "—")}</div></div>`).join("")
        || `<div class="empty" style="grid-column:1/-1">Belum ada foto. Minimal satu foto diperlukan untuk mengajukan laporan.</div>`;
      $$("#phList [data-dph]").forEach(b => b.onclick = () => { d.photos.splice(+b.dataset.dph, 1); drawPh(); });
    };
    $("#phFile").onchange = e => {
      const files = Array.from(e.target.files || []);
      files.forEach(f => shrink(f, url => {
        d.photos.push({ photo_type: $("#phType").value, file_url: url, caption: $("#phCap").value, taken_at: new Date().toISOString() });
        drawPh();
      }));
      e.target.value = "";
    };
    drawPh();

    $("#btnReset").onclick = () => { if (confirmBox("Kosongkan formulir ini?")) { S.draft = newDraft(); render(); } };
    $("#btnDraft").onclick = () => { pull(); commitDaily("DRAFT"); };
    $("#btnSubmit").onclick = () => { pull(); commitDaily("SUBMITTED"); };
  }
};
function photoName(d, p, i) {
  const w = bamkOf(d.bamk_id);
  const tk = tankNo(d.tank_id || (w ? w.tank_id : ""));
  return [(w ? w.bamk_no : "WO").replace(/[\/\\ ]/g, "-"), String(tk).replace(/[\/\\ ]/g, "-"),
  d.report_date, p.photo_type, String(i + 1).padStart(2, "0")].join("_") + ".jpg";
}
function threadHtml(list) {
  if (!list.length) return `<div class="empty">Belum ada catatan koordinasi.</div>`;
  return `<div class="lines">${list.slice().reverse().map(r => `<div class="line" style="grid-template-columns:1fr">
    <div><span class="b ${r.action === "TOLAK" ? "red" : r.action === "SETUJU" ? "teal" : "blue"}">${REVIEW_LABEL[r.action] || r.action}</span>
      <b class="small"> ${esc(r.user_name)}</b>
      <span class="tiny muted"> · ${esc(r.timestamp.slice(0, 16).replace("T", " "))}</span>
      <div class="small mt8">${esc(r.note || "—")}</div></div></div>`).join("")}</div>`;
}
function shrink(file, cb) {
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.62));
    };
    img.onerror = () => toast("Berkas foto tidak terbaca.", "err");
    img.src = ev.target.result;
  };
  r.readAsDataURL(file);
}
/* Memeriksa seluruh baris progress sebuah laporan terhadap dua aturan:
   kumulatif per bagian tidak boleh melewati volume BAMK bagian itu, dan
   satu tahap tidak boleh melampaui tahap sebelumnya. Mengembalikan teks
   pelanggaran pertama, atau string kosong bila semuanya sah. */
function periksaBatasProgress(d) {
  const W = bamkOf(d.bamk_id); if (!W) return "";
  const TH = tahapAktif();
  const baru = {};
  d.progress.forEach(p => {
    const k = p.part + "|" + p.stage_id;
    baru[k] = (baru[k] || 0) + nz(p.actual_qty);
  });
  const totalSampai = (part, stage_id) =>
    kumulatif(d.bamk_id, part, stage_id, d.daily_id) + (baru[part + "|" + stage_id] || 0);
  for (const b of BAGIAN) {
    const kap = volBagian(W, b[0]);
    for (let i = 0; i < TH.length; i++) {
      const t = TH[i], tot = totalSampai(b[0], t.stage_id);
      if (tot > kap + 0.005)
        return b[1] + " — " + t.stage_name + ": kumulatif " + fmt(tot, 2) +
          " m² melebihi volume BAMK " + fmt(kap, 2) + " m².";
      if (i > 0) {
        const seb = TH[i - 1], atas = totalSampai(b[0], seb.stage_id);
        if (tot > atas + 0.005)
          return b[1] + " — " + t.stage_name + " (" + fmt(tot, 2) + " m²) tidak boleh melebihi " +
            seb.stage_name + " (" + fmt(atas, 2) + " m²).";
      }
    }
  }
  return "";
}

function commitDaily(status) {
  const d = S.draft;
  if (!d.report_date) return toast("Isi tanggal laporan.", "err");
  if (!d.bamk_id) return toast("Pilih tanki. Tanpa BAMK yang sah laporan tidak dapat diproses.", "err");
  /* Gerbang dua lapis: SPK Pertamina harus terbit dan BAMK harus aktif. */
  const wCek = bamkOf(d.bamk_id);
  if (!wCek) return toast("BAMK tidak ditemukan. Muat ulang halaman.", "err");
  if (wCek.status !== "AKTIF") return toast("BAMK tanki ini belum berstatus AKTIF.", "err");
  if (!spkTerbit(wCek.spk_id)) return toast("SPK dari Pertamina untuk tanki ini belum berstatus TERBIT.", "err");
  if (status === "SUBMITTED") {
    if (!d.progress.length) return toast("Tambahkan minimal satu baris progress.", "err");
    if (d.progress.some(p => !p.part || !p.stage_id)) return toast("Setiap baris progress harus punya bagian dan tahap.", "err");
    if (d.progress.some(p => !p.activity)) return toast("Pilih aktivitas pada setiap baris progress.", "err");
    if (d.manpower.some(m => !m.pihak || !m.category))
      return toast("Setiap baris tenaga kerja harus menyebut pihak (HBM / Palda / Vendor) dan kategorinya.", "err");
    if (d.progress.some(p => nz(p.actual_qty) < 0)) return toast("Luas tidak boleh negatif.", "err");
    if (d.progress.every(p => nz(p.actual_qty) === 0)) return toast("Isi luas pada minimal satu baris.", "err");
    /* Kumulatif tidak boleh melebihi volume bagian, dan tahap berikutnya
       tidak boleh melampaui tahap sebelumnya. */
    const pelanggaran = periksaBatasProgress(d);
    if (pelanggaran) return toast(pelanggaran, "err");
    if (!d.hsse.permit_status) return toast("Status PTW/izin wajib diisi sebelum mengajukan.", "err");
    if (!d.photos.length) return toast("Lampirkan minimal satu foto bukti.", "err");
    if (!d.supervisor_name) return toast("Isi nama pengawas pada bagian 9.", "err");
  }
  const w = bamkOf(d.bamk_id);
  const id = d.daily_id || uid("DL");
  const wasRejected = d.status === "REJECTED";
  /* Satu laporan per tanki per hari — seluruh kegiatan hari itu digabung
     dalam satu laporan, tidak dipecah per shift. */
  const dup = DB.dailies.find(x => x.daily_id !== id && x.bamk_id === d.bamk_id && x.report_date === d.report_date);
  if (dup) return toast("Tanki ini sudah punya laporan untuk tanggal tersebut. Ubah laporan yang sudah ada, jangan membuat baru.", "err");

  ["progress", "manpower", "materials", "photos", "qc", "hsse", "issues"].forEach(k => {
    const arr = DB[k]; if (!arr) return;
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i].daily_id === id) {
      if (k === "issues" && arr[i].status === "CLOSED") continue;
      arr.splice(i, 1);
    }
  });

  const prev = byId(DB.dailies, "daily_id", id);
  const rev = (status === "SUBMITTED" && wasRejected) ? (nz(d.revision_no) + 1) : nz(d.revision_no);
  const head = {
    daily_id: id, report_date: d.report_date, bamk_id: d.bamk_id, tank_id: w.tank_id, area_id: w.area_id,
    admin_user_id: prev ? prev.admin_user_id : S.user.user_id,
    weather: d.weather, shift: d.shift, general_notes: d.general_notes,
    supervisor_side: d.supervisor_side, supervisor_name: d.supervisor_name,
    status, revision_no: rev, submitted_at: new Date().toISOString(), review_note: ""
  };
  const ix = DB.dailies.findIndex(x => x.daily_id === id);
  if (ix >= 0) DB.dailies[ix] = Object.assign(DB.dailies[ix], head); else DB.dailies.push(head);

  d.progress.forEach(p => DB.progress.push({
    progress_id: uid("PR"), daily_id: id, bamk_id: d.bamk_id,
    part: p.part, stage_id: p.stage_id, scope_id: p.scope_id || "",
    activity: p.activity === "Lainnya" ? ("Lainnya: " + (p.activity_other || "")) : p.activity,
    work_package: p.work_package || "", target_qty: nz(p.target_qty),
    actual_qty: nz(p.actual_qty), unit: p.unit, pct_complete: nz(p.pct_complete)
  }));
  d.manpower.forEach(m => DB.manpower.push({ manpower_id: uid("MP"), daily_id: id, bamk_id: d.bamk_id, pihak: m.pihak || "", category: m.category, worker_count: nz(m.worker_count), notes: m.notes || "" }));
  d.materials.forEach(m => DB.materials.push({ material_id: uid("MT"), daily_id: id, bamk_id: d.bamk_id, item: m.item, qty: nz(m.qty), unit: m.unit, do_no: m.do_no, notes: m.notes || "" }));
  d.photos.forEach(p => DB.photos.push({ photo_id: uid("PH"), daily_id: id, bamk_id: d.bamk_id, tank_id: w.tank_id, photo_type: p.photo_type, file_url: p.file_url, caption: p.caption, taken_at: p.taken_at, uploaded_by: S.user.user_id }));
  if (d.qc.inspection_type || d.qc.result) DB.qc.push({ inspection_id: uid("QC"), bamk_id: d.bamk_id, daily_id: id, inspection_date: d.report_date, inspection_type: d.qc.inspection_type, result: d.qc.result, rework_required: !!d.qc.rework_required, reference_no: d.qc.reference_no, remarks: d.qc.remarks, ma4_known: !!d.qc.ma4_known, ma4_date: d.qc.ma4_date || "" });
  if (d.hsse.permit_status) DB.hsse.push({ hsse_id: uid("HS"), daily_id: id, bamk_id: d.bamk_id, permit_status: d.hsse.permit_status, toolbox_status: d.hsse.toolbox_status, fit_to_work: d.hsse.fit_to_work, critical_finding: d.hsse.critical_finding, remarks: d.hsse.remarks });
  if (d.issue.description) DB.issues.push({ issue_id: uid("IS"), daily_id: id, bamk_id: d.bamk_id, issue_date: d.report_date, category: d.issue.category || "LAINNYA", description: d.issue.description, impact: d.issue.impact, action: d.issue.action, owner_side: d.issue.owner_side, owner: d.issue.owner, status: "OPEN" });

  if (status === "SUBMITTED") logReview(id, wasRejected ? "REVISI" : "SUBMIT",
    wasRejected ? ("Laporan diperbaiki dan diajukan kembali (revisi ke-" + rev + ").") : "Laporan diajukan ke Project Control.");
  audit(d.daily_id ? "UPDATE" : "CREATE", "07_DAILY_REPORT", id, "", status);
  save();
  toast(status === "DRAFT" ? "Draft tersimpan." : (wasRejected ? "Laporan diajukan ulang." : "Laporan diajukan ke Project Control."), "ok");
  S.draft = null;
  go("daily-list");
}

/* Menghapus satu laporan harian beserta seluruh turunannya. Hanya Project
   Control. Penghapusan disebarkan lewat tandaiHapus supaya perangkat lain
   tidak menghidupkannya kembali saat sinkron. */
function hapusLaporan(id) {
  if (!can("master")) return toast("Hanya Project Control yang boleh menghapus laporan.", "err");
  const d = byId(DB.dailies, "daily_id", id); if (!d) return;

  /* Laporan yang volumenya sudah diverifikasi tidak boleh dihapus begitu saja —
     angkanya sudah masuk ke rantai penerimaan dan tagihan. */
  const ver = DB.verifications.filter(v => v.daily_id === id && v.status === "VERIFIED");
  if (ver.length) return toast("Laporan ini sudah terverifikasi (" + ver.length +
    " baris). Batalkan verifikasinya lebih dulu sebelum bisa dihapus.", "err");

  const pr = DB.progress.filter(p => p.daily_id === id).length;
  const ph = DB.photos.filter(p => p.daily_id === id).length;
  const rincian = [pr ? pr + " baris progress" : "", ph ? ph + " foto" : ""].filter(Boolean).join(", ");
  if (!confirm("Hapus laporan " + dateID(d.report_date) + " untuk " + tankNo(d.tank_id) + "?\n" +
    (rincian ? "Ikut terhapus: " + rincian + ".\n" : "") +
    "Tindakan ini tidak bisa dibatalkan dan akan tercatat di Log Audit.")) return;

  ["progress", "manpower", "materials", "photos", "qc", "hsse", "issues", "verifications", "reviews"]
    .forEach(tab => {
      const kunci = SYNC_KEY[tab];
      (DB[tab] || []).filter(r => r.daily_id === id).forEach(r => tandaiHapus(tab, r[kunci]));
      DB[tab] = (DB[tab] || []).filter(r => r.daily_id !== id);
    });
  tandaiHapus("dailies", id);
  DB.dailies = DB.dailies.filter(x => x.daily_id !== id);

  audit("DELETE", "10_DAILY_REPORT", id, d.report_date + " · " + tankNo(d.tank_id), "dihapus Project Control");
  save(); render();
  toast("Laporan dihapus.", "ok");
}

        <td class="tiny">${esc(vs[0] ? userName(vs[0].verified_by) : "—")}</td></tr>`;

/* Memeriksa sendiri kelengkapan sebuah laporan harian dan mengembalikan
   daftar temuan. Dipakai di layar Review supaya Project Control tidak perlu
   mengingat sendiri apa saja yang harus dicek pada tiap laporan.
   Tingkat: "stop" menahan persetujuan, "warn" perlu ditimbang, "info" sekadar
   diketahui. Fungsi ini TIDAK memutuskan — keputusan tetap di tangan manusia. */
function periksaLaporan(id) {
  const d = byId(DB.dailies, "daily_id", id); if (!d) return [];
  const pr = DB.progress.filter(p => p.daily_id === id);
  const ph = DB.photos.filter(p => p.daily_id === id);
  const mp = DB.manpower.filter(p => p.daily_id === id);
  const mt = DB.materials.filter(p => p.daily_id === id);
  const qc = DB.qc.find(x => x.daily_id === id);
  const hs = DB.hsse.find(x => x.daily_id === id);
  const kn = DB.issues.filter(x => x.daily_id === id);
  const w = bamkOf(d.bamk_id);
  const luas = pr.reduce((a, p) => a + nz(p.actual_qty), 0);
  const orang = mp.reduce((a, m) => a + nz(m.worker_count), 0);
  const jenisFoto = new Set(ph.map(p => p.photo_type));
  const T = [];
  const add = (tk, judul, isi) => T.push({ tk, judul, isi });

  /* ---- yang menahan persetujuan ---- */
  if (!ph.length) add("stop", "Tidak ada foto bukti",
    "Laporan tanpa foto tidak bisa dipakai sebagai lampiran tagihan.");
  if (qc && qc.inspection_type && !qc.ma4_known) add("stop", "Inspeksi belum diketahui pengawas Pertamina",
    "SPK mewajibkan hasil inspeksi diketahui " + (DB.config.pertamina_supervisor || "Pengawas MA-4") +
    ". Persetujuan akan ditolak sistem sampai ini dilengkapi.");
  if (!hs || !hs.permit_status) add("stop", "Status izin kerja kosong",
    "Pekerjaan tanpa PTW aktif tidak boleh diakui.");
  const pelanggaran = periksaBatasProgress({ daily_id: id, bamk_id: d.bamk_id, progress: pr });
  if (pelanggaran) add("stop", "Volume melanggar batas BAMK", pelanggaran);

  /* ---- yang perlu ditimbang ---- */
  if (luas > 0 && !jenisFoto.has("AFTER")) add("warn", "Belum ada foto After",
    "Ada " + fmt(luas, 2) + " m² dilaporkan selesai, tetapi tidak ada foto hasil akhirnya.");
  if (luas > 0 && !jenisFoto.has("BEFORE")) add("warn", "Belum ada foto Before",
    "Tanpa foto kondisi awal, luas yang diklaim sulit dibuktikan saat verifikasi Pertamina.");
  if (luas > 0 && orang === 0) add("warn", "Ada progress tetapi tenaga kerja nol",
    fmt(luas, 2) + " m² dilaporkan selesai tanpa seorang pun tercatat bekerja.");
  if (luas === 0 && orang > 0 && !kn.length) add("warn", "Tenaga hadir tetapi progress nol",
    orang + " orang tercatat hadir tanpa hasil dan tanpa kendala tercatat. Mestinya ada alasannya.");
  if (mp.some(m => !m.pihak)) add("warn", "Ada tenaga kerja tanpa pihak",
    "Baris tenaga kerja yang tidak menyebut HBM atau Palda membuat rekap orang-hari tidak bisa dibelah per pihak.");
  const tahapCat = new Set(pr.filter(p => nz(p.actual_qty) > 0)
    .map(p => (tahapOf(p.stage_id) || {}).stage_code));
  if (luas > 0 && !mt.length && (tahapCat.has("T2") || tahapCat.has("T3")))
    add("warn", "Pengecatan tanpa catatan material",
      "Ada lapis cat dikerjakan tetapi tidak ada pemakaian cat tercatat. Rekonsiliasi material akan pincang.");
  kn.forEach(k => { if (!k.action) add("warn", "Kendala tanpa tindakan", "\"" + (k.description || "") + "\" belum diisi tindakannya."); });
  kn.forEach(k => { if (!k.owner_side) add("warn", "Kendala tanpa pihak PIC", "\"" + (k.description || "") + "\" belum menyebut pihak mana yang menanganinya — ini yang menentukan apakah bisa jadi dasar perpanjangan waktu SPK."); });
  if (qc && qc.result === "FAIL" && !qc.rework_required) add("warn", "Inspeksi gagal tanpa rework",
    "Hasil inspeksi FAIL tetapi tidak ditandai perlu rework.");
  if (!d.supervisor_name) add("warn", "Nama pengawas kosong", "Tidak ada pengawas yang menyaksikan tercatat.");

  /* ---- sekadar diketahui ---- */
  if (w) {
    const th = targetHarian(w);
    if (th > 0 && luas > 0) {
      const selisih = (luas - th) / th * 100;
      if (selisih < -40) add("info", "Jauh di bawah target harian",
        "Realisasi " + fmt(luas, 2) + " m² terhadap target " + fmt(th, 2) + " m²/hari (" + fmt(selisih, 0) + "%).");
      if (selisih > 60) add("info", "Jauh di atas target harian",
        "Realisasi " + fmt(luas, 2) + " m² terhadap target " + fmt(th, 2) + " m²/hari (+" + fmt(selisih, 0) + "%). Pastikan bukan salah ketik.");
    }
    const sisa = sisaHariSPK(w);
    if (sisa !== null && sisa < 0) add("info", "SPK sudah lewat batas waktu",
      "Batas SPK terlampaui " + (-sisa) + " hari. Pekerjaan setelah tanggal itu perlu dasar perpanjangan.");
  }
  const lalu = DB.dailies.filter(x => x.bamk_id === d.bamk_id && x.report_date < d.report_date &&
    x.status !== "REJECTED").sort((a, b) => b.report_date.localeCompare(a.report_date))[0];
  if (lalu) {
    const jeda = Math.round((new Date(d.report_date + "T00:00:00") - new Date(lalu.report_date + "T00:00:00")) / 86400000);
    if (jeda > 2) add("info", "Ada jeda " + jeda + " hari sejak laporan terakhir",
      "Laporan sebelumnya " + dateID(lalu.report_date) + ". Bila memang tidak bekerja, sebaiknya ada catatan kendalanya.");
  }
  if (d.revision_no > 0) add("info", "Laporan revisi ke-" + d.revision_no,
    "Sudah pernah dikembalikan. Periksa apakah catatan sebelumnya sudah dijawab.");

  return T;
}

/* Menggambar hasil periksaLaporan menjadi daftar temuan yang bisa dibaca. */
function kotakPeriksa(id) {
  const T = periksaLaporan(id);
  const n = { stop: T.filter(x => x.tk === "stop").length, warn: T.filter(x => x.tk === "warn").length };
  if (!T.length) return `<div class="note ok"><b>Pemeriksaan otomatis: tidak ada temuan.</b>
    Kelengkapan laporan ini wajar. Tetap periksa fotonya sendiri sebelum menyetujui.</div>`;
  const ikon = { stop: "✕", warn: "!", info: "i" };
  const warna = { stop: "var(--red)", warn: "var(--amber)", info: "var(--blue)" };
  return `<div class="note ${n.stop ? "stop" : n.warn ? "warn" : ""}">
    <b>Pemeriksaan otomatis — ${T.length} temuan</b>
    ${n.stop ? ` · <span style="color:var(--red)">${n.stop} menahan persetujuan</span>` : ""}
    ${n.warn ? ` · ${n.warn} perlu ditimbang` : ""}
    <div class="tiny muted mt8">Daftar ini hanya membantu mengingat. Keputusan tetap di tangan Anda.</div>
    <div class="mt8">${T.map(x => `<div style="display:flex;gap:8px;margin-bottom:6px;align-items:flex-start">
      <span style="color:${warna[x.tk]};font-weight:700;flex:0 0 14px;text-align:center">${ikon[x.tk]}</span>
      <span class="small"><b>${esc(x.judul)}.</b> ${esc(x.isi)}</span></div>`).join("")}</div>
  </div>`;
}

function reviewModal(id) {
  const d = byId(DB.dailies, "daily_id", id);
  const pr = DB.progress.filter(p => p.daily_id === id);
  const ph = DB.photos.filter(p => p.daily_id === id);
  const body = `
    <div class="fg c3 small">
      <div><div class="eyebrow">Tanggal</div>${dateID(d.report_date)}</div>
      <div><div class="eyebrow">BAMK / Tanki</div>${esc(bamkNo(d.bamk_id))} · ${esc(tankNo(d.tank_id))}</div>
      <div><div class="eyebrow">Penginput</div>${esc(userName(d.admin_user_id))}</div>
    </div>
    <div class="mt12">${kotakPeriksa(id)}</div>
    <div class="lines mt12"><div class="lh">Kuantitas terverifikasi</div>
    ${pr.map((p, i) => {
    const t = tahapOf(p.stage_id);
    return `<div class="line" style="grid-template-columns:1.6fr .8fr .8fr 1.2fr">
        <div><b class="small">${esc(bagianLabel(p.part))} — ${esc(t ? t.stage_name : "—")}</b><div class="tiny muted">${esc(p.activity || "")}</div></div>
        <label class="f"><span>Diajukan</span><input type="number" value="${p.actual_qty}" disabled></label>
        <label class="f"><span>Terverifikasi</span><input type="number" step="any" min="0" data-vq="${i}" value="${p.actual_qty}"></label>
        <label class="f"><span>Catatan</span><input type="text" data-vr="${i}" placeholder="alasan bila berbeda"></label></div>`;
  }).join("")}</div>
    ${ph.length ? `<div class="photos mt12">${ph.map(p => `<div class="ph"><span class="tag">${esc(p.photo_type)}</span><img src="${p.file_url}"><div class="cap">${esc(p.caption || "")}</div></div>`).join("")}</div>`
      : `<div class="note stop mt12">Laporan ini tidak memiliki foto bukti.</div>`}
    <label class="f mt12"><span>Catatan review</span><textarea id="rvNote" placeholder="tulis apa yang perlu diperbaiki, atau catatan persetujuan"></textarea></label>
    <div class="row"><button type="button" class="btn sm" id="rvSalin">Susun catatan dari temuan</button>
      <span class="tiny muted">menuliskan temuan yang menahan dan yang perlu ditimbang ke kotak di atas — masih bisa Anda sunting</span></div>
    <h4 class="mt16">Riwayat koordinasi</h4>${threadHtml(reviewsOf(id))}`;
  openModal("Review laporan " + d.report_date, body,
    `<button class="btn d" id="rvRej">Kembalikan ke Admin Site</button><button class="btn g" id="rvOk">Setujui &amp; verifikasi</button>`, true);
  if ($("#rvSalin")) $("#rvSalin").onclick = () => {
    const T = periksaLaporan(id).filter(x => x.tk !== "info");
    if (!T.length) return toast("Tidak ada temuan yang perlu ditulis.", "err");
    const kotak = $("#rvNote");
    const teks = "Mohon dilengkapi:\n" + T.map((x, i) => (i + 1) + ". " + x.judul + " — " + x.isi).join("\n");
    kotak.value = kotak.value.trim() ? kotak.value.trim() + "\n\n" + teks : teks;
    kotak.focus();
  };

  $("#rvRej").onclick = () => {
    const note = $("#rvNote").value.trim();
    if (!note) return toast("Isi catatan review sebagai alasan penolakan.", "err");
    d.status = "REJECTED"; d.review_note = note;
    d.revision_no = nz(d.revision_no) + 1;
    /* Kode kembalian: satu tanda pendek yang bisa disebut di telepon atau
       di papan pesan, supaya kedua pihak yakin sedang membicarakan laporan
       yang sama. Bentuknya KMB-<tanggal laporan>-<tanki>-<urutan revisi>. */
    d.return_code = "KMB-" + String(d.report_date || "").replace(/-/g, "").slice(2) +
      "-" + String(tankNo(d.tank_id) || "?").replace(/[^A-Za-z0-9]/g, "") +
      "-R" + d.revision_no;
    d.returned_at = new Date().toISOString();
    d.returned_by = S.user.user_id;
    logReview(id, "TOLAK", note);
    audit("UPDATE", "07_DAILY_REPORT", id, "SUBMITTED", "REJECTED", d.return_code + " · " + note);
    /* Pemberitahuan ke papan pesan kanal tanki yang bersangkutan, supaya
       Admin Site melihatnya walau sedang tidak membuka Daftar Laporan. */
    kirimPesan("BAMK:" + d.bamk_id,
      "Laporan " + dateID(d.report_date) + " dikembalikan · kode " + d.return_code +
      "\nCatatan: " + note, true);
    save(); closeModal();
    toast("Laporan dikembalikan. Kode " + d.return_code, "ok");
    render();
  };
  $("#rvOk").onclick = () => {
    const note = $("#rvNote").value.trim();
    let over = false;
    const rows = pr.map((p, i) => {
      const v = nz($(`[data-vq="${i}"]`).value), r = $(`[data-vr="${i}"]`).value.trim();
      if (v > nz(p.actual_qty)) over = true;
      return { p, v, r };
    });
    if (rows.some(r => r.v < 0)) return toast("Nilai verified tidak boleh negatif.", "err");
    /* SPK mensyaratkan hasil inspeksi diketahui pengawas Pertamina sebelum
       diakui. Laporan tanpa inspeksi tetap boleh lewat; yang punya inspeksi
       tapi belum diketahui, ditahan di sini. */
    const qcD = DB.qc.find(x => x.daily_id === id);
    if (qcD && qcD.inspection_type && !qcD.ma4_known)
      return toast("Inspeksi laporan ini belum diketahui " + (DB.config.pertamina_supervisor || "pengawas Pertamina") +
        ". Lengkapi dulu di laporan harian.", "err");
    if (over && !note) return toast("Volume terverifikasi melebihi yang diajukan. Isi catatan review sebagai dasar persetujuan.", "err");
    rows.forEach(r => {
      DB.verifications.push({
        verification_id: uid("VF"), progress_id: r.p.progress_id, daily_id: id, bamk_id: d.bamk_id,
        scope_id: r.p.scope_id, submitted_qty: nz(r.p.actual_qty), verified_qty: r.v,
        verified_by: S.user.user_id, verified_date: today(),
        status: "VERIFIED", remarks: r.r || note
      });
    });
    d.status = "APPROVED"; d.review_note = note;
    logReview(id, "SETUJU", note || ("Disetujui, volume terverifikasi " + fmt(rows.reduce((a, r) => a + r.v, 0), 2) + "."));
    audit("VERIFY", "15_VERIFICATION", id, "", rows.reduce((a, r) => a + r.v, 0), note);
    save(); closeModal(); toast("Laporan disetujui dan volume terverifikasi.", "ok"); render();
  };
}

function issueRecap() {
  const wk = {}, cat = {};
  DB.issues.forEach(i => {
    const k = weekKey(i.issue_date);
    wk[k.key] = wk[k.key] || { key: k.key, label: k.label, total: 0, open: 0, cats: {} };
    wk[k.key].total++; if (i.status !== "CLOSED") wk[k.key].open++;
    wk[k.key].cats[i.category] = (wk[k.key].cats[i.category] || 0) + 1;
    cat[i.category] = (cat[i.category] || 0) + 1;
  });
  const cats = Object.keys(cat).map(k => ({ k, n: cat[k] })).sort((a, b) => b.n - a.n);
  return { weeks: Object.values(wk).sort((a, b) => b.key.localeCompare(a.key)), cats };
}

function csvDownload(name, rows) {
  const body = rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + body], { type: "text/csv;charset=utf-8" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function recapRows(mode) {
  const ok = DB.dailies.filter(d => d.status !== "REJECTED");
  const map = {};
  ok.forEach(d => {
    const k = mode === "H" ? d.report_date : mode === "M" ? monthOf(d.report_date) : weekKey(d.report_date).key;
    const lab = mode === "H" ? dateID(d.report_date) : mode === "M" ? monthID(monthOf(d.report_date)) : weekKey(d.report_date).label;
    if (!map[k]) map[k] = { k, lab, target: 0, actual: 0, verified: 0, accepted: 0, billable: 0, mp: 0, issues: 0, laporan: 0 };
    const pr = DB.progress.filter(p => p.daily_id === d.daily_id);
    map[k].target += pr.reduce((a, p) => a + nz(p.target_qty), 0);
    map[k].actual += pr.reduce((a, p) => a + nz(p.actual_qty), 0);
    map[k].mp += DB.manpower.filter(m => m.daily_id === d.daily_id).reduce((a, m) => a + nz(m.worker_count), 0);
    map[k].issues += DB.issues.filter(i => i.daily_id === d.daily_id).length;
    map[k].laporan += 1;
    map[k].verified += DB.verifications.filter(v => v.daily_id === d.daily_id).reduce((a, v) => a + nz(v.verified_qty), 0);
  });
  DB.acceptances.forEach(a => {
    const k = mode === "H" ? a.acceptance_date : mode === "M" ? monthOf(a.acceptance_date) : weekKey(a.acceptance_date).key;
    if (map[k]) map[k].accepted += nz(a.accepted_qty);
  });
  DB.billables.forEach(b => { if (mode === "M" && map[b.period]) map[b.period].billable += nz(b.billable_qty); });
  return Object.values(map).sort((a, b) => b.k.localeCompare(a.k));
}
