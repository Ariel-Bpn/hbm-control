/* Laporan kemajuan pekerjaan untuk disampaikan rutin kepada pengawas
   Pertamina, sebagaimana diminta pada catatan SPK. Satu halaman per SPK
   berjalan, dibuka di jendela cetak supaya bisa langsung disimpan PDF. */
function laporanKemajuanPengawas() {
  const aktif = DB.spk.filter(x => x.status === "TERBIT" || x.status === "SELESAI");
  if (!aktif.length) return toast("Belum ada SPK terbit, jadi belum ada yang dilaporkan.", "err");
  const sampai = today();
  const bagian = aktif.map(sp => {
    const bs = DB.bamk.filter(b => b.spk_id === sp.spk_id);
    const vol = bs.reduce((a, b) => a + volBamk(b), 0);
    const earn = bs.reduce((a, b) => a + earnedBamk(b.bamk_id), 0);
    const sisa = sp.finish_date ? Math.round((new Date(sp.finish_date + "T00:00:00") - new Date(sampai + "T00:00:00")) / 86400000) : null;
    const hari = bs.length ? hariRencana(bs[0]) : 0;
    const lewat = (sp.start_date && hari) ? Math.min(hari, Math.max(0,
      Math.round((new Date(sampai + "T00:00:00") - new Date(sp.start_date + "T00:00:00")) / 86400000) + 1)) : 0;
    const rencanaPct = hari ? lewat / hari * 100 : 0;
    const aktualPct = vol ? earn / vol * 100 : 0;
    const dl = DB.dailies.filter(d => bs.some(b => b.bamk_id === d.bamk_id) && d.status !== "REJECTED");
    const kendala = DB.issues.filter(i => bs.some(b => b.bamk_id === i.bamk_id) && i.status !== "CLOSED");

    const perTanki = bs.map(b => {
      const rows = tahapAktif().map(t => {
        const per = BAGIAN.map(g => kumulatif(b.bamk_id, g[0], t.stage_id, null));
        return { t, per, jml: per.reduce((a, v) => a + v, 0) };
      });
      return { b, rows };
    });

    return `
    <h2>SPK ${esc(sp.spk_no)}</h2>
    <table class="k"><tbody>
      <tr><td>No. kontrak / SP</td><td>${esc(sp.contract_no || "—")}</td></tr>
      <tr><td>Jangka waktu</td><td>${esc(dateID(sp.start_date))} s/d ${esc(dateID(sp.finish_date))} (${nz(sp.duration_days)} hari kalender)</td></tr>
      <tr><td>Metode pelaksanaan</td><td>${esc(sp.method || "—")}</td></tr>
      <tr><td>Jam kerja</td><td>${esc(sp.work_hours || "—")}</td></tr>
      <tr><td>Sisa waktu</td><td>${sisa === null ? "—" : (sisa < 0 ? "terlampaui " + (-sisa) + " hari" : sisa + " hari")}</td></tr>
      <tr><td>Volume pekerjaan</td><td>${fmt(vol, 2)} m&sup2;</td></tr>
      <tr><td>Rencana s/d hari ini</td><td>${fmt(rencanaPct, 1)}%</td></tr>
      <tr><td>Realisasi s/d hari ini</td><td><b>${fmt(aktualPct, 1)}%</b> (${fmt(earn, 2)} m&sup2; setara selesai)</td></tr>
      <tr><td>Deviasi</td><td>${fmt(aktualPct - rencanaPct, 1)}%</td></tr>
      <tr><td>Jumlah laporan harian</td><td>${dl.length}</td></tr>
    </tbody></table>
    ${perTanki.map(x => `
      <h3>Tanki ${esc(tankNo(x.b.tank_id))} &mdash; BAMK ${esc(x.b.bamk_no)}</h3>
      <table class="k"><thead><tr><th>Tahap</th>${BAGIAN.map(g => `<th>${esc(g[1])}</th>`).join("")}<th>Jumlah</th><th>%</th></tr></thead>
      <tbody>${x.rows.map(r => `<tr><td>${esc(r.t.stage_name)}</td>
        ${r.per.map((v, i) => `<td>${fmt(v, 2)} / ${fmt(volBagian(x.b, BAGIAN[i][0]), 2)}</td>`).join("")}
        <td>${fmt(r.jml, 2)}</td><td>${fmt(volBamk(x.b) ? r.jml / volBamk(x.b) * 100 : 0, 1)}%</td></tr>`).join("")}
      </tbody></table>`).join("")}
    ${kendala.length ? `<h3>Kendala yang masih terbuka</h3><table class="k"><thead><tr><th>Tanggal</th><th>Kategori</th><th>Uraian</th><th>Tindakan</th></tr></thead>
      <tbody>${kendala.map(i => `<tr><td>${esc(i.issue_date)}</td><td>${esc(i.category)}</td><td>${esc(i.description)}</td><td>${esc(i.action || "—")}</td></tr>`).join("")}</tbody></table>`
        : `<p><i>Tidak ada kendala terbuka.</i></p>`}`;
  }).join("<hr>");

  const html = `<!doctype html><html lang="id"><head><meta charset="utf-8">

/* ============================================================
   MESIN SINKRONISASI
   Aplikasi tetap bekerja penuh tanpa internet. Sinkronisasi hanya
   menyatukan data antar perangkat lewat Google Apps Script.
   ============================================================ */
const SYNC = { jalan: false, timer: null, pesan: "", terakhirGagal: "", tunda: null, dorong: 15000 };

/* ============================================================
   BELUM TERKIRIM
   Setiap baris yang diubah diberi penanda waktu oleh tandaiPerubahan().
   Baris yang penanda waktunya lebih baru daripada kiriman terakhir berarti
   masih mengendap di perangkat ini saja. Angka inilah yang dipakai untuk
   lencana di sidebar, untuk menjadwalkan kiriman otomatis, dan untuk
   menahan pengguna sebelum menutup aplikasi.
   ============================================================ */
function capKirimTerakhir() { return Number((DB.config.sync || {}).kirim_ts || 0); }

/* Tabel mana saja yang punya perubahan belum terkirim, beserta jumlah barisnya. */
function tabelKotor() {
  const batas = capKirimTerakhir(), out = {};
  SYNC_TABLES.forEach(t => {
    let n = 0;
    (DB[t] || []).forEach(r => { if (Number(r._ts || 0) > batas) n++; });
    if (n) out[t] = n;
  });
  (DB.deleted || []).forEach(d => { if (d && d.table && out[d.table] == null) out[d.table] = 0; });
  return out;
}
function jumlahBelumTerkirim() {
  const k = tabelKotor();
  let n = 0;
  Object.keys(k).forEach(t => n += k[t]);
  return n + (DB.deleted || []).length + antreFoto();
}
function antreFoto() {
  return (DB.photos || []).filter(f => String(f.file_url || "").indexOf("data:") === 0).length;
}

function syncSiap() {
  const s = DB.config.sync || {};
  return !!(s.url && s.token);
}
function syncStamp(row) { if (!row._ts) row._ts = Date.now(); return row; }

/* Setiap baris yang belum punya penanda waktu diberi stempel sebelum dikirim. */
function stempelSemua() {
  SYNC_TABLES.forEach(t => (DB[t] || []).forEach(syncStamp));
}

/* Alamat Spreadsheet dan folder foto dilaporkan server pada setiap balasan.
   Dicatat di perangkat supaya selalu bisa dilihat di layar Sinkronisasi —
   tanpa itu, alamatnya hanya sempat muncul sesaat setelah tombol
   "Siapkan lembar di Spreadsheet" ditekan, dan gampang keliru dengan
   Spreadsheet lain yang kebetulan namanya mirip. */
function catatAlamatServer(r) {
  if (!r || !r.ok) return;
  const sy = DB.config.sync = DB.config.sync || {};
  let berubah = false;
  if (r.sheet_url && sy.sheet_url !== r.sheet_url) { sy.sheet_url = r.sheet_url; berubah = true; }
  if (r.folder_url && sy.folder_url !== r.folder_url) { sy.folder_url = r.folder_url; berubah = true; }
  if (r.versi && sy.versi_server !== r.versi) { sy.versi_server = r.versi; berubah = true; }
  if (berubah) { try { save(); } catch (e) { /* penyimpanan penuh, tidak menghalangi sinkron */ } }
}

async function serverCall(payload, timeoutMs) {
  const s = DB.config.sync;
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
  try {
    const r = await fetch(s.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: s.token }, payload)),
      redirect: "follow",
      signal: ctrl.signal
    });
    const teks = await r.text();
    try {
      const hasil = JSON.parse(teks);
      catatAlamatServer(hasil);
      return hasil;
    }
    catch (e) { return { ok: false, pesan: "Balasan server tidak dikenali. Pastikan Web App dipasang untuk 'Anyone'." }; }
  } catch (e) {
    return { ok: false, pesan: e.name === "AbortError" ? "Server tidak menjawab (waktu habis)." : "Tidak dapat menghubungi server. Periksa internet dan alamat Web App." };
  } finally { clearTimeout(to); }
}

/* Foto diunggah satu per satu ke Drive, lalu tautannya menggantikan data mentah
   agar penyimpanan perangkat tidak penuh dan Spreadsheet tetap ringan. */
/* Unggah pindaian surat (SPK / BAMK / BAKP) ke folder Drive khusus dokumen.
   Izin baca dipasang di sisi server, jadi tautannya langsung bisa dibuka siapa
   pun yang memegangnya — tidak ada lagi "Minta akses". */
const DOK_MAKS_MB = 8;
function unggahDokumen(file, kabar, selesai) {
  if (!file) return;
  if (!syncSiap()) return toast("Unggahan butuh sambungan ke server. Isi kata sandi sinkronisasi dulu.", "err");
  const mb = file.size / 1048576;
  if (mb > DOK_MAKS_MB)
    return toast("Berkas " + fmt(mb, 1) + " MB, melebihi batas " + DOK_MAKS_MB + " MB. Pindai ulang dengan mutu lebih rendah.", "err");
  const jenisOk = /pdf$/i.test(file.type) || /^image\//.test(file.type);
  if (!jenisOk) return toast("Hanya PDF atau foto yang bisa diunggah.", "err");

  const baca = new FileReader();
  baca.onerror = () => toast("Berkas gagal dibaca.", "err");
  baca.onload = async () => {
    if (kabar) kabar("Mengunggah " + fmt(mb, 1) + " MB\u2026");
    try {
      const r = await serverCall({ action: "dokumen", nama: file.name, data: baca.result }, 180000);
      if (!r || !r.ok) throw new Error((r && r.pesan) || "ditolak server");
      selesai(r.file_url, r.nama || file.name);
      toast("Pindaian tersimpan di Drive.", "ok");
    } catch (e) {
      if (kabar) kabar("");
      toast("Unggahan gagal: " + e.message, "err");
    }
  };
  baca.readAsDataURL(file);
}

/* Kotak seragam untuk kolom pindaian surat: tombol unggah, tombol buka,
   dan tetap menyediakan tempel tautan manual bagi yang sudah punya. */
function kotakPindaian(idInput, nilai, label) {
  return `<label class="f"><span>${esc(label)}</span>
    <input type="text" id="${idInput}" value="${esc(nilai || "")}" placeholder="unggah berkas, atau tempel tautan Drive"></label>
  <div class="row" style="margin-top:-6px">
    <label class="btn a sm">Unggah pindaian
      <input type="file" id="${idInput}File" accept="application/pdf,image/*" hidden></label>
    <button type="button" class="btn sm" id="${idInput}Buka">Buka berkas</button>
    <span class="tiny muted" id="${idInput}Ket">PDF atau foto, maksimal ${DOK_MAKS_MB} MB. Izin baca dipasang otomatis.</span>
  </div>`;
}
function pasangPindaian(idInput) {
  const inp = $("#" + idInput), berkas = $("#" + idInput + "File"),
    buka = $("#" + idInput + "Buka"), ket = $("#" + idInput + "Ket");
  if (!inp) return;
  const kabar = t => { if (ket) ket.textContent = t || ("PDF atau foto, maksimal " + DOK_MAKS_MB + " MB. Izin baca dipasang otomatis."); };
  if (berkas) berkas.onchange = e => {
    const f = e.target.files[0]; e.target.value = "";
    unggahDokumen(f, kabar, (url, nama) => { inp.value = url; kabar("Tersimpan: " + nama); });
  };
  if (buka) buka.onclick = () => {
    const u = (inp.value || "").trim();
    if (!u) return toast("Belum ada tautan pindaian.", "err");
    window.open(u, "_blank");
  };
}

async function unggahFoto(lapor) {
  const antre = DB.photos.filter(p => String(p.file_url || "").indexOf("data:") === 0);
  for (let i = 0; i < antre.length; i++) {
    const p = antre[i];
    if (lapor) lapor("Mengunggah foto " + (i + 1) + " dari " + antre.length + "…");
    const d = byId(DB.dailies, "daily_id", p.daily_id) || {};
    const nama = photoName(d, p, i);
    const r = await serverCall({ action: "photo", photo_id: p.photo_id, nama, data: p.file_url }, 120000);
    if (!r.ok) return r;
    p.file_id = r.file_id; p.file_url = r.file_url; p._ts = Date.now();
    save();
  }
  return { ok: true, jumlah: antre.length };
}

async function syncNow(lapor, opsi) {
  if (SYNC.jalan) return { ok: false, pesan: "Sinkronisasi sedang berjalan." };
  if (!syncSiap()) return { ok: false, pesan: "Alamat Web App dan kata sandi belum diisi." };
  SYNC.jalan = true;
  const kabar = m => { SYNC.pesan = m; if (lapor) lapor(m); };
  try {
    kabar("Menyiapkan data…");
    stempelSemua();

    const foto = await unggahFoto(kabar);
    if (!foto.ok) return foto;

    kabar("Mengirim dan menggabungkan data…");
    /* Kiriman berkala hanya membawa tabel yang benar-benar berubah. Server
       hanya menulis ulang lembar yang dikirim, jadi sinkron sering tidak
       membebani kuota Apps Script. Tombol Sinkronkan sekarang tetap
       mengirim semuanya, sebagai penyeragam kalau ada yang terlewat. */
    const capKirim = Date.now();
    const kotor = tabelKotor();
    const daftar = (opsi && opsi.hanyaKotor) ? Object.keys(kotor) : SYNC_TABLES;
    const kirim = {};
    daftar.forEach(t => {
      kirim[t] = (DB[t] || []).map(r => {
        const o = Object.assign({}, r);
        if (t === "meetings") { o.points_json = JSON.stringify(r.points || []); delete o.points; }
        if (t === "photos") delete o.file_url_data;
        return o;
      });
    });
    const r = await serverCall({ action: "push", tables: kirim, deleted: DB.deleted || [] }, 120000);
    if (!r.ok) return r;

    kabar("Memasang data terbaru…");
    terapkanServer(r.tables);
    bangunSidik();
    DB.deleted = [];
    DB.config.sync.last = new Date().toISOString();
    DB.config.sync.kirim_ts = capKirim;
    save();
    perbaruiLencana();
    const jml = SYNC_TABLES.reduce((a, t) => a + (DB[t] || []).length, 0);
    return { ok: true, pesan: "Selesai. " + jml + " baris tersimpan bersama" + (foto.jumlah ? ", " + foto.jumlah + " foto diunggah" : "") + ".", ringkas: r.ringkas };
  } finally {
    SYNC.jalan = false; SYNC.pesan = "";
  }
}

/* Data dari server menggantikan data lokal, karena server sudah menggabungkan
   kiriman semua perangkat pada langkah sebelumnya. */
function terapkanServer(tables) {
  if (!tables) return;
  SYNC_TABLES.forEach(t => {
    if (!tables[t]) return;
    DB[t] = tables[t].map(r => {
      const o = Object.assign({}, r);
      if (t === "meetings") {
        try { o.points = JSON.parse(o.points_json || "[]"); } catch (e) { o.points = []; }
        delete o.points_json;
      }
      if (t === "users") o.active = (o.active === true || o.active === "TRUE" || o.active === "true" || o.active === 1);
      if (t === "qc") o.rework_required = (o.rework_required === true || o.rework_required === "TRUE" || o.rework_required === "true");
      if (t === "documents") o.required_for_billing = (o.required_for_billing === true || o.required_for_billing === "TRUE" || o.required_for_billing === "true");
      return o;
    });
  });
  /* Jangan sampai tidak ada satu pun Project Control setelah tarik data. */
  if (!DB.users.some(u => u.role === "PROJECT_CONTROL" && u.active) && S.user) DB.users.push(S.user);
}

function aturAutoSync() {
  if (SYNC.timer) { clearInterval(SYNC.timer); SYNC.timer = null; }
  if (!DB.config.sync.auto || !syncSiap()) return;
  SYNC.timer = setInterval(() => sinkronDiamDiam("berkala"), 5 * 60 * 1000);
}

/* Sinkron yang berjalan sendiri, tanpa mengganggu layar. Kiriman berkala yang
   tidak membawa perubahan apa pun tetap berguna: server membalas dengan
   seluruh data terbaru, jadi perubahan orang lain ikut turun ke sini. */
/* Apakah ada jendela isian yang sedang terbuka. */
function modalTerbuka() {
  const m = typeof document !== "undefined" ? document.getElementById("mask") : null;
  return !!(m && m.classList.contains("on"));
}

async function sinkronDiamDiam(alasan) {
  if (SYNC.jalan || !syncSiap()) return { ok: false, pesan: "Belum siap." };
  /* Selama jendela isian terbuka, seluruh baris tidak boleh diganti oleh data
     dari server: jendela itu memegang acuan ke baris yang sedang diubah, dan
     kalau barisnya diganti objek baru, isian yang ditekan Simpan akan hilang
     tanpa pesan apa pun. Kiriman ditunda sampai jendelanya ditutup. */
  if (modalTerbuka()) { jadwalkanKirim(); return { ok: false, pesan: "Ditunda, ada jendela isian terbuka." }; }
  if (typeof navigator !== "undefined" && navigator.onLine === false) return { ok: false, pesan: "Perangkat luring." };
  const r = await syncNow(null, { hanyaKotor: true });
  if (r.ok) {
    SYNC.terakhirGagal = "";
    SYNC.alasanTerakhir = alasan || "";
    if (S.view === "settings" || S.view === "dashboard" || S.view === "sync") render();
  } else {
    SYNC.terakhirGagal = r.pesan;
  }
  perbaruiLencana();
  return r;
}

/* Perubahan apa pun menjadwalkan kiriman beberapa detik kemudian. Kalau
   pengguna masih mengetik, jadwalnya diundur lagi, sehingga satu sesi
   pengisian hanya menghasilkan satu kiriman. */
function jadwalkanKirim() {
  if (!S.user || !syncSiap() || !DB.config.sync.auto) return;
  if (SYNC.tunda) clearTimeout(SYNC.tunda);
  SYNC.tunda = setTimeout(() => {
    SYNC.tunda = null;
    if (jumlahBelumTerkirim() > 0) sinkronDiamDiam("perubahan");
  }, SYNC.dorong);
}

/* Kiriman penyelamat saat aplikasi ditutup atau tab ditinggalkan. Memakai
   fetch keepalive supaya kiriman tetap jalan meski halaman sudah ditutup. */
function kirimSaatTutup() {
  if (!syncSiap() || jumlahBelumTerkirim() === 0) return false;
  const kotor = tabelKotor(), kirim = {};
  Object.keys(kotor).forEach(t => {
    kirim[t] = (DB[t] || []).map(r => {
      const o = Object.assign({}, r);
      if (t === "meetings") { o.points_json = JSON.stringify(r.points || []); delete o.points; }
      if (t === "photos") { delete o.file_url_data; if (String(o.file_url || "").indexOf("data:") === 0) o.file_url = ""; }
      return o;
    });
  });
  const badan = JSON.stringify({
    token: DB.config.sync.token, action: "push", tables: kirim, deleted: DB.deleted || []
  });
  if (badan.length > 60000) return false;              /* terlalu besar untuk kiriman kilat */
  try {
    fetch(DB.config.sync.url, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: badan, keepalive: true, redirect: "follow"
    });
    return true;
  } catch (e) {
    try { return navigator.sendBeacon(DB.config.sync.url, new Blob([badan], { type: "text/plain;charset=utf-8" })); }
    catch (e2) { return false; }
  }
}

/* Lencana di sidebar: berapa perubahan yang masih mengendap di perangkat ini. */
function perbaruiLencana() {
  const kotak = typeof document !== "undefined" ? document.getElementById("sideSync") : null;
  if (!kotak) return;
  if (!syncSiap()) {
    kotak.className = "sidesync merah";
    kotak.innerHTML = `<b>Belum tersambung</b><span>data hanya di perangkat ini</span>`;
    return;
  }
  const n = jumlahBelumTerkirim();
  if (SYNC.jalan) { kotak.className = "sidesync"; kotak.innerHTML = `<b>Mengirim…</b><span>sedang menyatukan data</span>`; return; }
  if (n === 0) {
    const jam = DB.config.sync.last ? DB.config.sync.last.slice(11, 16) : "";
    kotak.className = "sidesync hijau";
    kotak.innerHTML = `<b>Semua terkirim</b><span>${jam ? "terakhir " + esc(jam) : "siap"}</span>`;
  } else {
    kotak.className = "sidesync kuning";
    kotak.innerHTML = `<b>${n} belum terkirim</b><span>tersimpan di perangkat ini</span>`;
  }
}

/* Pemicu-pemicu yang membuat data tidak pernah lama mengendap di perangkat. */
function pasangPemicuSinkron() {
  if (typeof window === "undefined" || SYNC.pemicuTerpasang) return;
  SYNC.pemicuTerpasang = true;

  /* berpindah tab atau mengunci layar HP */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { if (!kirimSaatTutup()) sinkronDiamDiam("pindah tab"); }
    else sinkronDiamDiam("kembali ke layar");
  });

  /* menutup aplikasi */
  window.addEventListener("pagehide", () => { kirimSaatTutup(); });
  window.addEventListener("beforeunload", e => {
    if (!S.user || jumlahBelumTerkirim() === 0) return;
    kirimSaatTutup();
    e.preventDefault();
    e.returnValue = "";
    return "";
  });

  /* internet kembali menyala */
  window.addEventListener("online", () => sinkronDiamDiam("internet kembali"));
  window.addEventListener("offline", () => perbaruiLencana());
}

/* Kotak alamat Spreadsheet & folder foto, ditampilkan tetap di layar
   Sinkronisasi. Alamat diisi sendiri oleh server pada sinkron mana pun. */

/* ============================================================
   PEMERIKSAAN SINKRON
   Menguji perjalanan data ke Google Sheets langkah demi langkah,
   supaya jelas bagian mana yang bermasalah: aplikasi, jaringan,
   atau Code.gs di Spreadsheet.

   Pemeriksaan ini TIDAK menyentuh data asli. Yang dikirim hanya
   satu baris uji pada tabel actions, yang dibaca kembali lalu
   dihapus. Data lokal tidak ditimpa oleh hasil pemeriksaan.
   ============================================================ */
const UJI = { hasil: [], jalan: false };
const UJI_IKON = { ok: "\u2713", gagal: "\u2717", peringatan: "!", info: "\u00b7" };
const UJI_WARNA = { ok: "var(--teal)", gagal: "var(--red)", peringatan: "var(--amber)", info: "var(--ink-3)" };
const UJI_TOTAL_LANGKAH = 23;

function modeJalan() {
  if (typeof location === "undefined") return "TIDAK DIKENAL";
  if (location.protocol === "file:") return "BERKAS LOKAL";
  if (/script\.google(usercontent)?\.com$/.test(location.hostname || "")) return "APPS SCRIPT";
  return "WEB";
}

function ujiTulis(judul, status, ket) {
  UJI.hasil.push({ judul: judul, status: status, ket: ket || "" });
  const kotak = typeof document !== "undefined" && document.getElementById ? document.getElementById("ujiIsi") : null;
  if (!kotak) return;
  const d = document.createElement("div");
  d.className = "ujirow";
  d.innerHTML = '<span class="ujiik" style="color:' + (UJI_WARNA[status] || UJI_WARNA.info) + '">' +
    (UJI_IKON[status] || UJI_IKON.info) + '</span><div><b>' + esc(judul) + '</b>' +
    (ket ? '<div class="ujiket">' + esc(ket) + '</div>' : '') + '</div>';
  kotak.appendChild(d);
  const bar = document.getElementById("ujiBar");
  if (bar) bar.style.width = Math.min(100, Math.round(UJI.hasil.length / UJI_TOTAL_LANGKAH * 100)) + "%";
  const mb = document.querySelector("#modal .mbody");
  if (mb) mb.scrollTop = mb.scrollHeight;
}

/* Menyalin teks ke papan klip, dengan cara cadangan untuk peramban lama. */
function salinTeks(teks, kabar) {
  if (!teks) return toast("Belum ada alamat untuk disalin.", "err");
  const manual = () => {
    const ta = document.createElement("textarea");
    ta.value = teks; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* peramban lama */ }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(teks).then(() => toast(kabar, "ok"), () => { manual(); toast(kabar, "ok"); });
  else { manual(); toast(kabar, "ok"); }
}

function salinHasilUji() {
  if (!UJI.hasil.length) return toast("Belum ada hasil untuk disalin.", "err");
  const tanda = { ok: "[ OK ]", gagal: "[GAGAL]", peringatan: "[ ! ]", info: "[  - ]" };
  const teks = ["PEMERIKSAAN SINKRON — HBM IPCS v" + APP_VERSI,
    "Waktu   : " + new Date().toLocaleString("id-ID"),
    "Pengguna: " + ((S.user && S.user.user_name) || "-"), ""]
    .concat(UJI.hasil.map(h => (tanda[h.status] || tanda.info) + " " + h.judul + (h.ket ? "\n         " + h.ket : "")))
    .join("\n");
  const manual = () => {
    const ta = document.createElement("textarea");
    ta.value = teks; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* peramban lama */ }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(teks).then(() => toast("Hasil disalin.", "ok"), () => { manual(); toast("Hasil disalin.", "ok"); });
  } else { manual(); toast("Hasil disalin.", "ok"); }
}

async function jalankanUjiSinkron() {
  if (UJI.jalan) return;
  UJI.jalan = true; UJI.hasil = [];
  SYNC.jalan = true;                       /* tahan sinkron otomatis selama pemeriksaan */
  const tombol = $("#ujiGo");
  if (tombol) { tombol.disabled = true; tombol.textContent = "Memeriksa\u2026"; }
  const kotak = $("#ujiIsi"); if (kotak) kotak.innerHTML = "";
  const bar = $("#ujiBar"); if (bar) bar.style.width = "0";
  try {
    await periksaSinkron(ujiTulis);
  } catch (e) {
    ujiTulis("Pemeriksaan berhenti", "gagal", "Kesalahan tak terduga: " + ((e && e.message) ? e.message : String(e)));
  } finally {
    UJI.jalan = false; SYNC.jalan = false;
    if ($("#ujiBar")) $("#ujiBar").style.width = "100%";
    if ($("#ujiGo")) { $("#ujiGo").disabled = false; $("#ujiGo").textContent = "Periksa lagi"; }
  }
}

/* Inti pemeriksaan. Dipisah dari tampilan supaya bisa diuji sendiri. */
async function periksaSinkron(T) {
  const sy = (DB.config && DB.config.sync) || {};

  /* --- 1. jati diri perangkat --------------------------------- */
  T("Versi aplikasi", "info", "v" + APP_VERSI + " \u00b7 mode " + modeJalan());
  if (typeof navigator !== "undefined" && navigator && navigator.onLine === false)
    T("Perangkat sedang luring", "gagal", "Tidak ada internet. Sambungkan dulu, lalu periksa lagi.");

  /* --- 2. alamat Web App -------------------------------------- */
  const url = String(sy.url || "").trim();
  if (!url) {
    T("Alamat Web App", "gagal", "Belum diisi. Isi kolom Alamat Web App lalu tekan Simpan pengaturan.");
    return T("Pemeriksaan berhenti", "info", "Sisa pemeriksaan tidak dapat dijalankan tanpa alamat server.");
  }
  T("Alamat server", "info", url.length > 70 ? url.slice(0, 70) + "\u2026" : url);
  if (/\/dev\s*$/.test(url))
    T("Bentuk alamat Web App", "gagal", "Alamat berakhiran /dev hanya bisa dibuka oleh pemilik skrip. HP Admin Site akan selalu gagal. Pakai alamat penerapan yang berakhiran /exec.");
  else if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))
    T("Bentuk alamat Web App", "peringatan", "Bentuknya tidak seperti alamat Web App Apps Script yang biasa. Seharusnya https://script.google.com/macros/s/\u2026/exec");
  else
    T("Bentuk alamat Web App", "ok", "Berakhiran /exec.");

  /* --- 3. kata sandi ------------------------------------------ */
  if (!String(sy.token || "").trim()) {
    T("Kata sandi sinkronisasi", "gagal", "Masih kosong, jadi perangkat ini belum pernah menyatu dengan Spreadsheet. Buka Code.gs, salin isi TOKEN, tempel di kolom Kata sandi sinkronisasi, lalu tekan Simpan pengaturan.");
    return T("Pemeriksaan berhenti", "info", "Server akan menolak setiap kiriman selama kata sandi kosong.");
  }
  T("Kata sandi sinkronisasi", "ok", "Terisi di perangkat ini.");

  /* --- 4. ping ------------------------------------------------- */
  const png = await serverCall({ action: "ping" }, 30000);
  if (!png || !png.ok) {
    const pesan = (png && png.pesan) || "Server tidak menjawab.";
    T("Menghubungi server (ping)", "gagal", pesan);
    T("Saran", "info", /sandi|token/i.test(pesan)
      ? "Kata sandi di aplikasi berbeda dengan TOKEN di Code.gs. Samakan persis, termasuk huruf besar-kecilnya."
      : "Periksa internet, lalu pastikan Web App masih diterapkan dengan akses \"Anyone\" dan alamatnya sesuai penerapan terakhir. Setiap kali Code.gs diubah, penerapan harus diperbarui.");
    return T("Pemeriksaan berhenti", "info", "Langkah berikutnya membutuhkan sambungan ke server.");
  }
  T("Menghubungi server (ping)", "ok", "Server menjawab. Spreadsheet: " + (png.sheet || "-"));
  if (png.sheet_url)
    T("Alamat Spreadsheet", "info", png.sheet_url);
  else
    T("Alamat Spreadsheet tidak dilaporkan", "peringatan", "Code.gs yang terpasang belum mengirimkan alamat Spreadsheet. Unggah Code.gs v" +
      CODEGS_VERSI + " lalu terapkan ulang, supaya alamatnya selalu terlihat di layar Sinkronisasi.");

  const versiServer = String(png.versi || "");
  if (!versiServer)
    T("Versi Code.gs tidak diketahui", "peringatan", "Code.gs yang terpasang belum melaporkan versinya, jadi kemungkinan besar lebih lama dari aplikasi ini (v" +
      APP_VERSI + "). Unggah Code.gs terbaru lalu terapkan ulang.");
  else if (versiServer !== CODEGS_VERSI)
    T("Versi Code.gs berbeda", "peringatan", "Aplikasi v" + APP_VERSI + " membutuhkan Code.gs v" + CODEGS_VERSI +
      ", yang terpasang v" + versiServer + ". Unggah Code.gs yang sesuai lalu terapkan ulang.");
  else
    T("Versi Code.gs cocok", "ok", "Aplikasi v" + APP_VERSI + " dengan Code.gs v" + CODEGS_VERSI + ", sesuai.");

  /* --- 5. tarik seluruh data ---------------------------------- */
  const tarik = await serverCall({ action: "pull" }, 120000);
  if (!tarik || !tarik.ok || !tarik.tables) {
    T("Mengambil data dari Spreadsheet", "gagal", (tarik && tarik.pesan) || "Server tidak mengirimkan data.");
    return T("Pemeriksaan berhenti", "info", "Perbandingan data tidak dapat dilakukan.");
  }
  const srv = tarik.tables;

  const takDikenal = SYNC_TABLES.filter(t => !Array.isArray(srv[t]));
  if (takDikenal.length)
    T("Code.gs di server sudah ketinggalan", "gagal", "Server tidak mengenal tabel: " + takDikenal.join(", ") +
      ". Data tabel itu tidak akan pernah tersimpan. Unggah Code.gs terbaru ke Apps Script, jalankan penerapan ulang, lalu periksa lagi.");
  else
    T("Daftar tabel server cocok", "ok", SYNC_TABLES.length + " tabel dikenali server, sama dengan aplikasi ini.");

  const isi = SYNC_TABLES.filter(t => (srv[t] || []).length).map(t => t + ": " + srv[t].length);
  T("Mengambil data dari Spreadsheet", "ok", isi.length ? isi.join(" \u00b7 ") : "Semua lembar masih kosong.");

  /* --- 6. bandingkan perangkat ini dengan server -------------- */
  const beda = []; let totalLokal = 0, totalServer = 0;
  SYNC_TABLES.forEach(t => {
    const kunci = SYNC_KEY[t];
    const idLokal = (DB[t] || []).map(r => String(r[kunci] || "")).filter(Boolean);
    const idServer = (srv[t] || []).map(r => String(r[kunci] || "")).filter(Boolean);
    totalLokal += idLokal.length; totalServer += idServer.length;
    const setL = new Set(idLokal), setS = new Set(idServer);
    let hanyaL = 0, hanyaS = 0;
    setL.forEach(k => { if (!setS.has(k)) hanyaL++; });
    setS.forEach(k => { if (!setL.has(k)) hanyaS++; });
    if (hanyaL || hanyaS) beda.push(t + " (" +
      (hanyaL ? hanyaL + " hanya di sini" : "") + (hanyaL && hanyaS ? ", " : "") +
      (hanyaS ? hanyaS + " hanya di server" : "") + ")");
  });
  /* Log audit bertambah sendiri setiap kali ada yang ditekan — termasuk oleh
     pemeriksaan ini. Selisih yang HANYA pada audit adalah keadaan normal,
     bukan tanda ada yang salah, jadi jangan ditampilkan sebagai peringatan. */
  const bedaPenting = beda.filter(x => x.indexOf("audit (") !== 0);
  const hanyaAudit = beda.length && !bedaPenting.length;
  if (!beda.length)
    T("Jumlah baris sama", "ok", "Server dan perangkat ini sudah sama: " + totalLokal + " baris.");
  else if (hanyaAudit)
    T("Jumlah baris sama, kecuali log audit", "ok", "Perangkat ini " + totalLokal + " baris, server " +
      totalServer + " baris — selisihnya hanya pada log audit (" + beda.join("") +
      "). Log audit bertambah sendiri setiap kali ada tombol ditekan, termasuk oleh pemeriksaan ini, " +
      "jadi selisih kecil di sini wajar dan hilang sendiri saat Sinkronkan ditekan.");
  else
    T("Ada baris yang belum menyatu", "peringatan", "Perangkat ini " + totalLokal + " baris, server " +
      totalServer + " baris. " + beda.join(" \u00b7 ") + ". Tekan Sinkronkan sekarang untuk menyatukannya.");

  /* --- 7. mutu data di perangkat ini --------------------------- */
  let tanpaTs = 0; const ganda = [];
  SYNC_TABLES.forEach(t => {
    const kunci = SYNC_KEY[t], hitung = {};
    (DB[t] || []).forEach(r => {
      if (!r._ts) tanpaTs++;
      const id = String(r[kunci] || ""); if (!id) return;
      hitung[id] = (hitung[id] || 0) + 1;
    });
    Object.keys(hitung).forEach(id => { if (hitung[id] > 1) ganda.push(t + "/" + id); });
  });
  if (tanpaTs)
    T("Sebagian baris belum berpenanda waktu", "info", tanpaTs + " baris. Penandanya dipasang otomatis begitu Sinkronkan sekarang ditekan.");
  else
    T("Semua baris berpenanda waktu", "ok", "Penilaian mana yang lebih baru dapat dilakukan dengan benar.");
  if (ganda.length)
    T("Ada nomor ganda di perangkat ini", "peringatan", ganda.slice(0, 5).join(", ") +
      (ganda.length > 5 ? " dan " + (ganda.length - 5) + " lagi" : "") + ". Baris bernomor sama akan saling menimpa saat digabung.");

  /* Baris bawaan pabrik yang belum pernah disentuh, dan baris yang isinya
     berbeda dengan server. Dua hal inilah yang paling sering membuat data
     antar perangkat tampak berbeda. */
  let bawaan = 0, bedaIsi = [], kalah = 0;
  SYNC_TABLES.forEach(t => {
    const kunci = SYNC_KEY[t];
    const petaSrv = {};
    (srv[t] || []).forEach(r => { if (r[kunci]) petaSrv[String(r[kunci])] = r; });
    (DB[t] || []).forEach(r => {
      if (Number(r._ts || 0) === 1) bawaan++;
      const lawan = petaSrv[String(r[kunci] || "")];
      if (!lawan) return;
      const bandingkan = x => {
        let o = "";
        Object.keys(x).sort().forEach(k => { if (k !== "_ts") o += k + "=" + String(x[k] == null ? "" : x[k]) + ";"; });
        return o;
      };
      if (bandingkan(r) !== bandingkan(lawan)) {
        bedaIsi.push(t);
        if (Number(r._ts || 0) < Number(lawan._ts || 0)) kalah++;
      }
    });
  });
  if (bawaan)
    T("Masih ada data contoh bawaan", "info", bawaan + " baris masih persis seperti bawaan aplikasi dan bertanda waktu paling tua, jadi tidak akan menimpa data kantor. Baris ini hilang sendiri begitu data asli masuk.");
  if (bedaIsi.length) {
    const hitung = {};
    bedaIsi.forEach(t => hitung[t] = (hitung[t] || 0) + 1);
    /* Kalau seluruh baris yang berbeda justru lebih baru di perangkat ini,
       itu memang alur normal: perubahan Anda belum sempat terkirim. Yang
       benar-benar perlu diperhatikan adalah baris yang lebih TUA di sini,
       karena isinya akan diganti oleh data server. */
    const rincian = Object.keys(hitung).map(t => t + ": " + hitung[t]).join(" \u00b7 ");
    if (kalah)
      T("Ada baris yang akan diganti data server", "peringatan", rincian + ". " + kalah +
        " di antaranya lebih tua daripada di server, jadi isinya akan diganti saat Sinkronkan ditekan. " +
        "Bila perubahan itu penting, catat dulu sebelum menyinkronkan.");
    else
      T("Ada perubahan yang belum terkirim", "ok", rincian +
        ". Semuanya lebih baru daripada di server, jadi perubahan Anda yang akan dipakai. " +
        "Tekan Sinkronkan sekarang untuk mengirimnya — ini keadaan biasa, bukan masalah.");
  }

  const antre = (DB.photos || []).filter(f => String(f.file_url || "").indexOf("data:") === 0).length;
  if (antre)
    T("Foto menunggu diunggah", "peringatan", antre + " foto masih tersimpan di perangkat ini dan belum ada di Drive. Foto terkirim saat Sinkronkan sekarang ditekan.");
  else
    T("Tidak ada foto tertahan", "ok", "Semua foto sudah berada di Drive.");

  const belum = jumlahBelumTerkirim();
  if (belum)
    T("Ada perubahan yang belum terkirim", "peringatan", belum + " perubahan masih mengendap di perangkat ini. Kiriman otomatis akan menjalankannya sendiri; tekan Sinkronkan sekarang bila ingin segera.");
  else
    T("Tidak ada yang mengendap di perangkat ini", "ok", "Semua perubahan sudah sampai ke Spreadsheet.");

  T("Kiriman otomatis", DB.config.sync.auto ? "ok" : "peringatan", DB.config.sync.auto
    ? "Menyala: mengirim sendiri " + Math.round(SYNC.dorong / 1000) + " detik sesudah ada perubahan, saat berpindah tab, saat aplikasi ditutup, saat internet kembali, dan tiap 5 menit."
    : "Mati. Data hanya terkirim bila tombol Sinkronkan ditekan, sehingga mudah tertinggal di perangkat ini.");

  const tunda = (DB.deleted || []).length;
  if (tunda)
    T("Penghapusan menunggu dikirim", "info", tunda + " baris yang Anda hapus belum disampaikan ke server, jadi masih terlihat di perangkat lain sampai Sinkronkan ditekan.");

  /* --- 7b. kesehatan rantai SPK > BAMK > eksekusi -------------- */
  const bobot = totalBobot();
  if (!tahapAktif().length)
    T("Tahapan pengecatan", "gagal", "Belum ada tahap aktif. Layar lapangan tidak bisa dipakai sampai Master Data \u203a Tahapan diisi.");
  else if (Math.abs(bobot - 100) > 0.01)
    T("Bobot tahapan", "gagal", "Total bobot tahap aktif " + fmt(bobot, 1) + "%, seharusnya 100%. Selama belum 100%, persentase progress tanki salah.");
  else
    T("Bobot tahapan", "ok", tahapAktif().length + " tahap aktif, total bobot 100%.");

  const bamkYatim = DB.bamk.filter(b => !spkOf(b.spk_id));
  if (bamkYatim.length)
    T("BAMK tanpa SPK", "gagal", bamkYatim.length + " BAMK belum ditautkan ke SPK Pertamina (" +
      bamkYatim.slice(0, 3).map(b => b.bamk_no || b.bamk_id).join(", ") + "). Tanki ini tidak akan muncul di layar lapangan.");
  else if (DB.bamk.length)
    T("BAMK tertaut SPK", "ok", DB.bamk.length + " BAMK, semuanya menempel pada SPK.");

  const aktifTanpaTerbit = DB.bamk.filter(b => b.status === "AKTIF" && !spkTerbit(b.spk_id));
  if (aktifTanpaTerbit.length)
    T("BAMK aktif tanpa SPK terbit", "peringatan", aktifTanpaTerbit.length + " BAMK berstatus AKTIF tetapi SPK induknya belum TERBIT, jadi tetap terkunci di lapangan.");

  const bedaVol = DB.bamk.filter(b => {
    const v = volDariTanki(b.tank_id), hit = v.shell + v.acc + v.roof, tot = volBamk(b);
    return hit > 0 && tot > 0 && Math.abs(tot - hit) / hit > 0.01;
  });
  if (bedaVol.length)
    T("Volume BAMK beda dari hitungan tanki", "peringatan", bedaVol.length + " BAMK selisihnya lebih dari 1% terhadap luas eksterior hasil hitungan (" +
      bedaVol.slice(0, 3).map(b => tankNo(b.tank_id)).join(", ") + "). Periksa mana yang benar sebelum dipakai menagih.");
  else if (DB.bamk.length)
    T("Volume BAMK", "ok", "Seluruh volume BAMK cocok dengan hitungan luas eksterior dalam batas 1%.");

  const perluTinjau = DB.progress.filter(p => p.perlu_tinjau).length;
  if (perluTinjau)
    T("Baris progress warisan versi lama", "peringatan", perluTinjau + " baris progress dari versi sebelum 1.8 diberi bagian Shell dan tahap pertama secara otomatis. Project Control perlu meninjaunya sekali.");

  const spkLewat = DB.spk.filter(x => x.status === "TERBIT" && x.finish_date && x.finish_date < today());
  if (spkLewat.length)
    T("SPK melewati batas waktu", "peringatan", spkLewat.length + " SPK sudah lewat tanggal selesai tetapi masih berstatus TERBIT (" +
      spkLewat.slice(0, 3).map(x => x.spk_no).join(", ") + ").");

  /* --- 8. kirim catatan uji ----------------------------------- */
  /* Nomor uji harus benar-benar unik: nomor yang pernah dihapus akan ditolak
     server, jadi tidak boleh terulang meski dua pemeriksaan berdekatan. */
  const idUji = "UJI-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
  const capUji = new Date().toISOString();
  const tsUji = Date.now();
  const barisUji = {
    action_id: idUji, action: "CATATAN UJI SINKRON \u2014 dihapus otomatis", owner: "SISTEM",
    decision_by: "", due_date: today(), status: "UJI", closed_by: "", closed_date: "",
    remarks: capUji, _ts: tsUji
  };
  const kirim = await serverCall({ action: "push", tables: { actions: [barisUji] }, deleted: [] }, 120000);
  if (!kirim || !kirim.ok) {
    T("Mengirim catatan uji", "gagal", (kirim && kirim.pesan) || "Server menolak kiriman.");
    return T("Pemeriksaan berhenti", "info", "Kiriman dari perangkat ini tidak diterima server.");
  }
  T("Mengirim catatan uji", "ok", "ID " + idUji);

  const balik = ((kirim.tables && kirim.tables.actions) || []).filter(r => String(r.action_id) === idUji)[0];
  if (!balik) {
    T("Catatan uji TIDAK kembali", "gagal", "Server menerima kiriman tetapi tidak menyimpannya. Masalahnya di Code.gs / Spreadsheet, bukan di aplikasi ini.");
  } else {
    T("Catatan uji kembali dari server", "ok", "Kirim dan terima berjalan normal.");

    const tsSama = String(balik._ts || "") === String(tsUji);
    if (tsSama)
      T("Penanda waktu ikut tersimpan", "ok", "Perubahan dari perangkat lain dapat dinilai mana yang lebih baru.");
    else
      T("Penanda waktu hilang saat disimpan", "gagal", "Kolom _ts tidak kembali utuh (dikirim " + tsUji +
        ", kembali \"" + String(balik._ts || "") + "\"). Akibatnya perubahan pada baris lama tidak menyebar ke perangkat lain \u2014 data akan tampak berbeda-beda.");

    const capUtuh = String(balik.remarks || "") === capUji;
    if (capUtuh)
      T("Tanggal-dan-jam bertahan utuh", "ok", "Google Sheets tidak memangkas kolom berisi waktu.");
    else
      T("Tanggal-dan-jam dipangkas Spreadsheet", "peringatan", "Dikirim \"" + capUji + "\", kembali \"" +
        String(balik.remarks || "") + "\". Jam pengajuan laporan dan jam foto bisa hilang sebagian.");
  }

  /* --- 9. periksa jam pada data yang sudah ada ---------------- */
  const KOLOM_WAKTU = { dailies: "submitted_at", photos: "taken_at", reviews: "timestamp", audit: "timestamp" };
  let potong = 0, contoh = "";
  Object.keys(KOLOM_WAKTU).forEach(t => {
    const kol = KOLOM_WAKTU[t];
    (srv[t] || []).forEach(r => {
      const v = String(r[kol] == null ? "" : r[kol]);
      if (v && /^\d{4}-\d{2}-\d{2}$/.test(v)) { potong++; if (!contoh) contoh = t + "." + kol + " = " + v; }
    });
  });
  if (potong)
    T("Ada jam yang sudah terpangkas di Spreadsheet", "peringatan", potong + " baris hanya menyimpan tanggal tanpa jam (contoh " +
      contoh + "). Isinya tidak hilang, tetapi jamnya tidak dapat dipulihkan.");
  else
    T("Jam pada data lama masih utuh", "ok", "Tidak ditemukan kolom waktu yang terpangkas.");

  /* --- 10. hapus catatan uji ---------------------------------- */
  const buang = await serverCall({
    action: "push", tables: { actions: [] },
    deleted: [{ table: "actions", id: idUji, ts: Date.now() }]
  }, 120000);
  if (!buang || !buang.ok) {
    T("Mengirim perintah hapus", "gagal", (buang && buang.pesan) || "Server menolak perintah hapus.");
    T("Sisa catatan uji", "peringatan", "Baris " + idUji + " masih tertinggal di lembar actions. Hapus manual bila mengganggu.");
  } else {
    const masih = ((buang.tables && buang.tables.actions) || []).some(r => String(r.action_id) === idUji);
    if (masih) {
      T("Perintah hapus TIDAK dijalankan", "gagal", "Baris uji masih ada di Spreadsheet. Inilah sebabnya data yang Anda hapus bisa hidup lagi di perangkat lain. Perlu perbaikan di Code.gs.");
    } else {
      T("Perintah hapus dijalankan", "ok", "Penghapusan menyebar dengan benar.");

      /* Uji terpenting untuk keluhan \"data beda-beda\": apakah server MENGINGAT
         penghapusan? Bila tidak, HP yang salinannya masih lama akan mengirim
         balik baris yang sudah dihapus, dan baris itu hidup lagi. */
      const balikLagi = await serverCall({ action: "push", tables: { actions: [barisUji] }, deleted: [] }, 120000);
      if (!balikLagi || !balikLagi.ok) {
        T("Menguji penghapusan diingat", "peringatan", (balikLagi && balikLagi.pesan) || "Server tidak menjawab pada percobaan ini.");
      } else {
        const hidup = ((balikLagi.tables && balikLagi.tables.actions) || []).some(r => String(r.action_id) === idUji);
        if (hidup) {
          T("Baris terhapus bisa hidup lagi", "gagal", "Server tidak mengingat penghapusan. Perangkat yang belum sempat menarik data akan mengembalikan baris yang sudah Anda hapus, sehingga isi laptop dan HP tidak pernah sama. Perlu Code.gs v1.4 yang menyimpan catatan penghapusan.");
          await serverCall({ action: "push", tables: { actions: [] }, deleted: [{ table: "actions", id: idUji, ts: Date.now() }] }, 120000);
        } else {
          T("Penghapusan diingat server", "ok", "Baris yang sudah dihapus ditolak masuk lagi" +
            (balikLagi.nisan ? " (" + balikLagi.nisan + " catatan penghapusan tersimpan)" : "") +
            ". Laptop dan HP akan tetap sama isinya.");
        }
      }
    }
  }

  /* --- 11. pengguna & PIN ------------------------------------- */
  const aktif = v => (v === true || v === 1 || v === "TRUE" || v === "true" || v === "1");
  /* Gambaran gabungan: keadaan pengguna sesudah Sinkronkan ditekan. */
  const petaUser = {};
  (srv.users || []).forEach(u => { if (u.user_id) petaUser[u.user_id] = u; });
  (DB.users || []).forEach(u => { if (u.user_id) petaUser[u.user_id] = u; });
  const semuaUser = Object.keys(petaUser).map(k => petaUser[k]);

  const pcServer = (srv.users || []).filter(u => u.role === "PROJECT_CONTROL" && aktif(u.active)).length;
  const pcGabung = semuaUser.filter(u => u.role === "PROJECT_CONTROL" && aktif(u.active)).length;
  if (pcServer)
    T("Akun Project Control ada di server", "ok", pcServer + " akun aktif.");
  else if (pcGabung)
    T("Akun Project Control belum sampai ke server", "peringatan", "Akun itu baru ada di perangkat ini. Tekan Sinkronkan sekarang, supaya Anda tetap bisa masuk dari perangkat lain.");
  else
    T("Tidak ada Project Control aktif", "gagal", "Tidak ada akun berperan Project Control yang aktif, baik di server maupun di perangkat ini.");

  const petaPin = {}; const pinKembar = [];
  semuaUser.forEach(u => {
    const k = String(u.pin == null ? "" : u.pin); if (!k) return;
    (petaPin[k] = petaPin[k] || []).push(u.user_name || u.user_id);
  });
  Object.keys(petaPin).forEach(k => { if (petaPin[k].length > 1) pinKembar.push(petaPin[k].join(" & ")); });
  if (pinKembar.length)
    T("Ada PIN yang dipakai lebih dari satu orang", "gagal", pinKembar.join(" \u00b7 ") +
      ". Layar masuk mengenali orang dari PIN saja, jadi yang kedua tidak akan pernah bisa masuk. Ganti salah satunya di Pengaturan \u203a Pengguna.");
  else
    T("Setiap PIN unik", "ok", semuaUser.length + " pengguna, tidak ada PIN kembar.");

  const nolDepan = semuaUser.filter(u => /^0/.test(String(u.pin == null ? "" : u.pin))).length;
  if (nolDepan)
    T("Ada PIN berawalan angka nol", "peringatan", nolDepan + " PIN. Google Sheets membuang nol di depan, sehingga PIN seperti 0123 berubah menjadi 123 setelah sinkron dan pemiliknya tidak bisa masuk lagi. Ganti dengan PIN yang tidak diawali nol.");

  /* --- 12. besar data ----------------------------------------- */
  let besar = 0;
  try { besar = JSON.stringify(DB).length; } catch (e) { besar = 0; }
  const mb = besar / 1048576;
  if (mb > 6)
    T("Besar data perangkat ini", "peringatan", mb.toFixed(2) + " MB \u2014 mendekati batas kiriman Apps Script. Sinkronkan agar foto pindah ke Drive, lalu unduh cadangan dan bersihkan data lama.");
  else
    T("Besar data perangkat ini", "ok", mb.toFixed(2) + " MB, masih jauh dari batas kiriman.");

  T("Pemeriksaan selesai", "info", "Tekan \"Salin hasil\" bila perlu dikirimkan untuk ditindaklanjuti.");
}

/* Baris mana yang harus diisi saat Simpan ditekan. Kalau sinkron sempat
   berjalan sementara jendela terbuka, seluruh baris diganti objek baru dan
   acuan yang dipegang jendela menjadi yatim — isian akan hilang diam-diam.
   Karena itu barisnya dicari ulang berdasarkan nomornya saat menyimpan. */
function sasaranSimpan(arr, kunci, id, cadangan) {
  if (!id) return cadangan;
  const baris = byId(arr, kunci, id);
  if (baris) return baris;
  toast("Baris ini sudah tidak ada — mungkin dihapus dari perangkat lain. Tutup jendela ini lalu periksa kembali.", "err");
  return null;
}

/* Alasan sebuah baris master tidak boleh dihapus. Baris yang sudah dipakai
   di tempat lain tidak dihapus, supaya tidak ada laporan atau tagihan yang
   menggantung tanpa induk. */
function alasanTakBolehHapus(tab, id) {
  const pakai = [];
  const hitung = (arr, kolom, nama) => {
    const n = (arr || []).filter(r => r[kolom] === id).length;
    if (n) pakai.push(n + " " + nama);
  };
  if (tab === "area") hitung(DB.tanks, "area_id", "tanki");
  if (tab === "tank") { hitung(DB.spk_item, "tank_id", "baris SPK"); hitung(DB.bamk, "tank_id", "BAMK"); hitung(DB.dailies, "tank_id", "laporan harian"); }
  if (tab === "spk") { hitung(DB.spk_item, "spk_id", "baris tanki"); hitung(DB.bamk, "spk_id", "BAMK"); }
  if (tab === "stage") hitung(DB.progress, "stage_id", "baris progress");
  if (tab === "bamk") {
    hitung(DB.scopes, "bamk_id", "scope"); hitung(DB.dailies, "bamk_id", "laporan harian");
    hitung(DB.targets, "bamk_id", "target"); hitung(DB.verifications, "bamk_id", "verifikasi");
    hitung(DB.billables, "bamk_id", "baris layak tagih"); hitung(DB.billings, "bamk_id", "tagihan");
  }
  if (tab === "scope") { hitung(DB.progress, "scope_id", "baris progress"); hitung(DB.verifications, "scope_id", "verifikasi"); }
  return pakai.length ? pakai.join(", ") : "";
}

function hapusMaster(tab, id) {
  const M = MASTER_TABEL[tab]; if (!M) return;
  const baris = byId(M.arr(), M.kunci, id);
  if (!baris) return toast("Baris sudah tidak ada.", "err");

  const alasan = alasanTakBolehHapus(tab, id);
  if (alasan) return toast("Tidak bisa dihapus: masih dipakai oleh " + alasan + ". Ubah atau hapus itu dulu.", "err");

  if (!confirmBox("Hapus " + M.nama + " \"" + (M.label(baris) || id) + "\" ?\n\n" +
    "Penghapusan ini juga berlaku di Spreadsheet dan di perangkat lain begitu tersinkron, dan tidak bisa dibatalkan.")) return;

  tandaiHapus(M.tabel, id);
  const arr = M.arr();
  const i = arr.findIndex(r => r[M.kunci] === id);
  if (i >= 0) arr.splice(i, 1);
  audit("DELETE", M.log, id, M.label(baris) || "", "");
  save();
  closeModal();
  render();
  toast(M.nama.charAt(0).toUpperCase() + M.nama.slice(1) + " dihapus.", "ok");
}

    const s = id ? byId(DB.scopes, "scope_id", id) : {
      scope_id: uid("SC"), bamk_id: DB.bamk[0] ? DB.bamk[0].bamk_id : "", tank_id: "", scope_code: "",
      scope_description: "", unit: "m2", contract_rate: 0, palda_rate: 0, approved_qty: 0, revision: "R0", status: "AKTIF"
    };
    title = id ? "Ubah scope" : "Scope baru";
    body = `<div class="fg c3">
      <label class="f"><span>BAMK <em>*</em></span><select id="xWo">${opts(DB.bamk, s.bamk_id, w => w.bamk_id, w => w.bamk_no)}</select></label>
      <label class="f"><span>Kode scope <em>*</em></span><input type="text" id="xCode" value="${esc(s.scope_code)}"></label>
      <label class="f"><span>Satuan</span><input type="text" id="xU" value="${esc(s.unit)}"></label>
      <label class="f"><span>Kuantitas disetujui</span><input type="number" step="any" id="xQ" value="${s.approved_qty}"></label>
      <label class="f"><span>Revisi</span><input type="text" id="xRev" value="${esc(s.revision)}"></label>
      <label class="f"><span>Status</span><select id="xSt">${opts(["AKTIF", "NONAKTIF"].map(x => ({ x })), s.status, o => o.x, o => o.x)}</select></label>
    </div>
    <label class="f"><span>Uraian <em>*</em></span><input type="text" id="xDesc" value="${esc(s.scope_description)}"></label>
    ${can("money") ? `<div class="fg c2">
      <label class="f"><span>Rate kontrak (Rp)</span><input type="number" step="any" id="xR1" value="${s.contract_rate}"></label>
      <label class="f"><span>Rate ${esc(DB.config.partner_name)} (Rp)</span><input type="number" step="any" id="xR2" value="${s.palda_rate}"></label></div>
      <div class="note">Data komersial internal. Tidak pernah ditampilkan pada wajah Admin Site.</div>` : ""}`;
    onSave = () => {
      const w = bamkOf($("#xWo").value);
      const rec = sasaranSimpan(DB.scopes, "scope_id", id, s); if (!rec) return false;
      Object.assign(rec, {
        bamk_id: $("#xWo").value, tank_id: w ? w.tank_id : "", scope_code: $("#xCode").value,
        scope_description: $("#xDesc").value, unit: $("#xU").value, approved_qty: nz($("#xQ").value),
        revision: $("#xRev").value, status: $("#xSt").value
      });
      if (can("money")) { rec.contract_rate = nz($("#xR1").value); rec.palda_rate = nz($("#xR2").value); }
      if (!rec.scope_code || !rec.scope_description) return toast("Kode dan uraian scope wajib diisi.", "err");
      if (!id) DB.scopes.push(rec); audit(id ? "UPDATE" : "CREATE", "05_SCOPE_MASTER", rec.scope_id, "", rec.scope_code); return true;
    };
  }

  if (tab === "target") {
    const t = id ? byId(DB.targets, "target_id", id) : {
      target_id: uid("TG"), bamk_id: DB.bamk[0] ? DB.bamk[0].bamk_id : "", period: monthOf(today()),
      planned_qty: 0, planned_pct: 0, cumulative_plan_qty: 0, source: "Monthly Schedule", revision: "R0"
    };
    title = id ? "Ubah target" : "Target baru";
    body = `<div class="fg c3">
      <label class="f"><span>Periode (YYYY-MM) <em>*</em></span><input type="text" id="xPer" value="${esc(t.period)}"></label>
      <label class="f"><span>BAMK</span><select id="xWo">${opts(DB.bamk, t.bamk_id, w => w.bamk_id, w => w.bamk_no)}</select></label>
      <label class="f"><span>Rencana volume</span><input type="number" step="any" id="xQ" value="${t.planned_qty}"></label>
      <label class="f"><span>Rencana %</span><input type="number" step="any" id="xP" value="${t.planned_pct}"></label>
      <label class="f"><span>Sumber</span><input type="text" id="xSrc" list="dlSumber" autocomplete="off" value="${esc(t.source)}" placeholder="pilih atau ketik sendiri"></label>
      <label class="f"><span>Revisi</span><input type="text" id="xRev" value="${esc(t.revision)}"></label></div>
      <div class="note">Kolom <b>Sumber</b> mencatat dari mana angka rencana ini berasal, supaya nanti bisa ditelusuri
        kalau angkanya dipertanyakan. Pilih yang paling mendekati, atau ketik sendiri.</div>
      ${daftarPilihan("dlSumber", SUMBER_TARGET, DB.targets.map(x => x.source))}`;
    onSave = () => {
      const rec = sasaranSimpan(DB.targets, "target_id", id, t); if (!rec) return false;
      Object.assign(rec, {
        period: $("#xPer").value, bamk_id: $("#xWo").value, planned_qty: nz($("#xQ").value),
        planned_pct: nz($("#xP").value), source: $("#xSrc").value, revision: $("#xRev").value
      });
      if (!/^\d{4}-\d{2}$/.test(rec.period)) return toast("Periode harus berformat YYYY-MM.", "err");
      if (!id) DB.targets.push(rec); audit(id ? "UPDATE" : "CREATE", "06_TARGET_PLAN", rec.target_id, "", rec.period); return true;
    };
  }

  openModal(title, body,
    (id ? `<button class="btn danger" id="xHapus">Hapus</button>` : "") +
    `<button class="btn p" id="xSave">Simpan</button>`);
  $("#xSave").onclick = () => { if (onSave() !== false) { save(); closeModal(); render(); } };
  if (id && $("#xHapus")) $("#xHapus").onclick = () => hapusMaster(tab, id);

  if (tab === "spk" || tab === "bamk") pasangPindaian("xScan");

  /* --- SPK: durasi dihitung sendiri dari tmt mulai dan selesai --- */
  if (tab === "spk") {
    const hitungDur = () => {
      const a = $("#xSd").value, z = $("#xFd").value;
      $("#xDur").value = (a && z) ? Math.max(0, Math.round((new Date(z + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000) + 1) : 0;
    };
    $("#xSd").onchange = hitungDur; $("#xFd").onchange = hitungDur; hitungDur();
  }

  /* --- BAMK: total volume hidup, tombol ambil dari hitungan tanki,
         dan peringatan bila volume BAMK meleset dari hitungan luas eksterior --- */
  if (tab === "bamk") {
    const segar = () => {
      const vs = nz($("#xVs").value), va = nz($("#xVa").value), vr = nz($("#xVr").value);
      const tot = vs + va + vr;
      $("#xVt").value = fmt(tot, 2);
      const v = volDariTanki($("#xTank").value), hit = v.shell + v.acc + v.roof;
      const kotak = $("#xBeda"); if (!kotak) return;
      if (hit <= 0) { kotak.innerHTML = `Tanki ini belum punya diameter/tinggi, jadi tidak ada pembanding.`; return; }
      const beda = tot - hit, pctBeda = hit ? Math.abs(beda) / hit * 100 : 0;
      kotak.innerHTML = `Hitungan luas eksterior tanki: <b>${fmt(hit, 2)}</b> m&sup2;. Selisih dengan BAMK: ` +
        `<b style="color:${pctBeda > 1 ? "var(--amber)" : "var(--teal)"}">${beda >= 0 ? "+" : ""}${fmt(beda, 2)} m&sup2; (${fmt(pctBeda, 2)}%)</b>` +
        (pctBeda > 1 ? ` — periksa kembali, selisihnya lebih dari 1%.` : ` — dalam batas wajar.`);
    };
    ["#xVs", "#xVa", "#xVr"].forEach(k => { $(k).oninput = segar; });
    $("#xTank").onchange = segar;
    $("#xAmbil").onclick = () => {
      const v = volDariTanki($("#xTank").value);
      if (v.shell + v.acc + v.roof <= 0) return toast("Tanki ini belum punya diameter dan tinggi di Master Data.", "err");
      $("#xVs").value = v.shell.toFixed(2); $("#xVa").value = v.acc.toFixed(2); $("#xVr").value = v.roof.toFixed(2);
      segar(); toast("Volume diisi dari hitungan luas eksterior.", "ok");
    };
    /* Ganti SPK berarti daftar tankinya ikut berganti — jendela digambar ulang. */
    $("#xSpk").onchange = () => {
      const rec = id ? byId(DB.bamk, "bamk_id", id) : null;
      if (rec) { rec.spk_id = $("#xSpk").value; masterModal("bamk", id); }
      else { S.f.spkBaru = $("#xSpk").value; masterModal("bamk", null); }
    };
    segar();
  }

  /* Rincian luas eksterior dihitung langsung saat tipe, diameter, atau tinggi
     diubah, supaya angkanya bisa dibandingkan dengan lembar Excel sebelum disimpan. */
  if (tab === "tank") {
    const gambarLuas = () => {
      const kotak = $("#xLuas"); if (!kotak) return;
      const tipe = $("#xType").value, D = nz($("#xD").value), H = nz($("#xH").value);
      const L = luasEksterior(tipe, D, H);
      if (!L) {
        kotak.innerHTML = `<div class="note">Isi diameter dan tinggi untuk melihat luas pengecatan eksterior.</div>`;
        return;
      }
      kotak.innerHTML = `<div class="note"><b>Luas pengecatan eksterior</b> — faktor atap ${tipe} = ${fmt(faktorAtap(tipe), 2)},
        allowance perlengkapan ${fmt(accPersen(), 1)}%
        <div class="mt8" style="font-family:var(--mono);font-size:12px;line-height:1.9">
          Shell luar &nbsp;= &pi; &times; ${fmt(D, 2)} &times; ${fmt(H, 2)} = <b>${fmt(L.shell, 1)}</b> m&sup2;<br>
          Atap &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= &frac14; &pi; &times; ${fmt(D, 2)}&sup2; &times; ${fmt(faktorAtap(tipe), 2)} = <b>${fmt(L.atap, 1)}</b> m&sup2;<br>
          Perlengkapan = ${fmt(L.jumlah, 1)} &times; ${fmt(accPersen(), 1)}% = <b>${fmt(L.acc, 1)}</b> m&sup2;<br>
          <span style="font-size:13px">TOTAL &nbsp;&nbsp;&nbsp;&nbsp;= <b>${fmt(L.total, 1)}</b> m&sup2;</span>
        </div>
        <button class="btn sm mt8" id="xPakai">Pakai ${fmt(L.total, 1)} m&sup2; sebagai baseline</button></div>`;
      $("#xPakai").onclick = () => {
        $("#xQ").value = L.total.toFixed(1);
        $("#xU").value = "m2";
        toast("Baseline diisi dari perhitungan luas eksterior.", "ok");
      };
    };
    ["xType", "xD", "xH"].forEach(i => { const e = $("#" + i); if (e) { e.oninput = gambarLuas; e.onchange = gambarLuas; } });
    gambarLuas();
  }
}

  bind() {
    $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
    const tab = S.tab || "proj", c = DB.config;

    if (tab === "proj") {
      paintLogo($("#cfgLogo"));
      $("#cSave").onclick = () => {
        Object.assign(c, {
          project_code: $("#cCode").value, contract_no: $("#cCon").value, project_name: $("#cName").value,
          client_name: $("#cClient").value, contractor_name: $("#cCtr").value, partner_name: $("#cPart").value,
          start_date: $("#cS").value, end_date: $("#cE").value, tank_target: nz($("#cTk").value),
          revision: $("#cRev").value, alarm_waspada: nz($("#cW").value), alarm_kritis: nz($("#cK").value),
          roof_factor: { CRT: nz($("#cFC").value), FRT: nz($("#cFF").value), DRT: nz($("#cFD").value) },
          acc_pct: nz($("#cACC").value),
          target_basis: $("#cTB").value, spk_alarm_h: nz($("#cSA").value),
          pertamina_supervisor: $("#cPW").value, party_two_name: $("#cP2").value,
          party_two_addr: $("#cP2A").value
        });
        audit("UPDATE", "26_SYSTEM_CONFIG", "config", "", c.project_code);
        save(); toast("Pengaturan tersimpan.", "ok"); boot();
      };
      $("#cLogo").onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        shrinkLogo(f, url => { c.logo = url; save(); toast("Logo diperbarui.", "ok"); boot(); });
      };
      if ($("#cLogoDel")) $("#cLogoDel").onclick = () => { c.logo = null; save(); boot(); };
    }

    if (tab === "user" && can("users")) {
      const userModal = id => {
        const u = id ? byId(DB.users, "user_id", id) : { user_id: uid("US"), user_name: "", role: "ADMIN_SITE", pin: "", active: true, last_login: null };
        openModal(id ? "Ubah pengguna" : "Pengguna baru", `
          <div class="fg c2">
            <label class="f"><span>Nama <em>*</em></span><input type="text" id="uN" value="${esc(u.user_name)}"></label>
            <label class="f"><span>Peran</span><select id="uR">${opts(Object.keys(ROLE_LABEL).map(k => ({ k })), u.role, o => o.k, o => ROLE_LABEL[o.k])}</select></label>
            <label class="f"><span>PIN (4–6 angka)</span><input type="text" id="uP" inputmode="numeric" maxlength="6" value="${esc(u.pin)}"></label>
            <label class="f"><span>Status</span><select id="uA"><option value="1" ${u.active ? "selected" : ""}>Aktif</option><option value="0" ${u.active ? "" : "selected"}>Nonaktif</option></select></label>
          </div>
          <div class="note">Masuk ke aplikasi hanya memakai PIN, jadi setiap pengguna wajib punya PIN yang berbeda.
            Admin Site hanya melihat menu input laporan harian — nilai kontrak, tarif dan tagihan tidak pernah tampil di wajah tersebut.</div>
          ${id ? `<label class="f"><span>Alasan perubahan (dicatat di Log Audit)</span><input type="text" id="uWhy" placeholder="mis. PIN lupa, permintaan yang bersangkutan"></label>` : ""}`,
          `${id ? `<button class="btn d" id="uDel">Hapus pengguna</button>` : ""}<button class="btn p" id="uSave">Simpan</button>`);
        $("#uSave").onclick = () => {
          const pin = $("#uP").value.trim();
          if (!$("#uN").value.trim()) return toast("Nama pengguna wajib diisi.", "err");
          if (!/^\d{4,6}$/.test(pin)) return toast("PIN harus 4 sampai 6 angka.", "err");
          if (DB.users.some(x => x.user_id !== u.user_id && String(x.pin) === pin))
            return toast("PIN ini sudah dipakai pengguna lain. Pilih angka lain.", "err");
          if (id && u.role === "PROJECT_CONTROL" && $("#uR").value !== "PROJECT_CONTROL" &&
            DB.users.filter(x => x.role === "PROJECT_CONTROL" && x.active).length < 2)
            return toast("Harus ada minimal satu Project Control yang aktif.", "err");
          const pinBerubah = id && String(u.pin) !== pin;
          Object.assign(u, { user_name: $("#uN").value.trim(), role: $("#uR").value, pin, active: $("#uA").value === "1" });
          if (!id) DB.users.push(u);
          audit(id ? "UPDATE" : "CREATE", "23_USER_MASTER", u.user_id,
            "", u.user_name + " / " + u.role + (pinBerubah ? " / PIN diubah" : ""),
            id ? ($("#uWhy") ? $("#uWhy").value : "") : "");
          save(); closeModal(); render();
          toast(id ? "Pengguna diperbarui." : "Pengguna baru ditambahkan.", "ok");
        };
        if ($("#uDel")) $("#uDel").onclick = () => {
          if (u.user_id === S.user.user_id) return toast("Anda tidak dapat menghapus akun yang sedang dipakai.", "err");
          if (u.role === "PROJECT_CONTROL" && DB.users.filter(x => x.role === "PROJECT_CONTROL").length < 2)
            return toast("Project Control terakhir tidak boleh dihapus.", "err");
          const punyaLaporan = DB.dailies.some(x => x.admin_user_id === u.user_id);
          if (!confirmBox("Hapus pengguna " + u.user_name + "?" +
            (punyaLaporan ? " Laporan yang pernah dibuatnya tetap tersimpan atas namanya." : ""))) return;
          DB.users = DB.users.filter(x => x.user_id !== u.user_id);
          tandaiHapus("users", u.user_id);
          audit("DELETE", "23_USER_MASTER", u.user_id, u.user_name + " / " + u.role, "dihapus",
            $("#uWhy") ? $("#uWhy").value : "");
          save(); closeModal(); render(); toast("Pengguna dihapus.", "ok");
        };
      };
      if ($("#uBersih")) $("#uBersih").onclick = () => {
        if (!confirmBox("Hapus sisa akun Super Admin dari versi lama?")) return;
        bersihkanSuperAdmin();
        audit("DELETE", "23_USER_MASTER", "-", "Super Admin", "dihapus", "Peran Super Admin sudah tidak dipakai");
        save(); render(); toast("Akun Super Admin lama dibersihkan.", "ok");
      };
      if ($("#uNew")) $("#uNew").onclick = () => userModal(null);
      $$("[data-us]").forEach(b => b.onclick = () => userModal(b.dataset.us));
    }

    if (tab === "sync") {
      const kabar = (m, jenis) => { $("#syMsg").innerHTML = `<div class="note ${jenis || ""}">${esc(m)}</div>`; };
      const ambilIsian = () => {
        c.sync = c.sync || {};
        c.sync.url = $("#syUrl").value.trim();
        c.sync.token = $("#syTok").value.trim();
        c.sync.auto = $("#syAuto").checked;
      };
      const sibuk = t => { ["syTest", "sySetup", "syGo", "syPeriksa", "sySave"].forEach(i => { if ($("#" + i)) $("#" + i).disabled = t; }); };

      $("#sySave").onclick = () => {
        ambilIsian(); save(); aturAutoSync();
        audit("UPDATE", "26_SYSTEM_CONFIG", "sync", "", c.sync.url ? "diatur" : "dikosongkan");
        kabar("Pengaturan sinkronisasi tersimpan.", "");
      };
      $("#syPeriksa").onclick = () => { ambilIsian(); save(); bukaPeriksaSinkron(); };
      if ($("#syCopyUrl")) $("#syCopyUrl").onclick = () => salinTeks((c.sync || {}).sheet_url || "", "Alamat Spreadsheet disalin.");
      $("#syTest").onclick = async () => {
        ambilIsian(); save();
        if (!syncSiap()) return kabar("Isi alamat Web App dan kata sandinya lebih dulu.", "stop");
        sibuk(true); kabar("Menghubungi server…");
        const r = await serverCall({ action: "ping" }, 30000);
        sibuk(false);
        kabar(r.ok ? "Tersambung. Spreadsheet: " + (r.sheet || "-") : r.pesan, r.ok ? "" : "stop");
      };
      $("#sySetup").onclick = async () => {
        ambilIsian(); save();
        if (!syncSiap()) return kabar("Isi alamat Web App dan kata sandinya lebih dulu.", "stop");
        sibuk(true); kabar("Menyiapkan lembar…");
        const r = await serverCall({ action: "setup" }, 60000);
        sibuk(false);
        kabar(r.ok ? r.pesan + " Alamat Spreadsheet: " + (r.sheet_url || "-") : r.pesan, r.ok ? "" : "stop");
      };
      $("#syGo").onclick = async () => {
        ambilIsian(); save();
        if (!syncSiap()) return kabar("Isi alamat Web App dan kata sandinya lebih dulu.", "stop");
        sibuk(true);
        const r = await syncNow(m => kabar(m));
        sibuk(false);
        if (r.ok) { toast("Sinkronisasi selesai.", "ok"); render(); kabar(r.pesan, ""); }
        else kabar(r.pesan, "stop");
      };
    }

    if (tab === "cal") {
      $("#hAdd").onclick = () => {
        const d = $("#hDate").value; if (!d) return;
        c.holidays = c.holidays || [];
        if (c.holidays.indexOf(d) < 0) c.holidays.push(d);
        save(); render();
      };
      $$("[data-hd]").forEach(b => b.onclick = () => { c.holidays = c.holidays.filter(x => x !== b.dataset.hd); save(); render(); });
    }

    if (tab === "data") {
      $("#bkOut").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], { type: "application/json" }));
        a.download = "CADANGAN_HBM_IPCS_" + today() + ".json"; a.click(); URL.revokeObjectURL(a.href);
      };
      $("#bkIn").onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          try {
            const j = JSON.parse(ev.target.result);
            if (!j.meta || !j.dailies) throw 0;
            if (!confirmBox("Data pada perangkat ini akan diganti dengan isi berkas cadangan. Lanjutkan?")) return;
            DB = j; save(); toast("Cadangan dipulihkan.", "ok"); boot();
          } catch (x) { toast("Berkas bukan cadangan HBM IPCS yang sah.", "err"); }
        };
        r.readAsText(f);
      };
      $$("[data-ex]").forEach(b => b.onclick = () => {
        const arr = DB[b.dataset.ex] || [];
        if (!arr.length) return toast("Tabel " + b.dataset.ex + " masih kosong.", "err");
        const keys = Object.keys(arr[0]).filter(k => k !== "file_url");
        csvDownload(b.dataset.ex.toUpperCase() + "_" + today() + ".csv",
          [keys].concat(arr.map(o => keys.map(k => o[k]))));
      });
      $("#wipeTx").onclick = () => {
        if (!confirmBox("Hapus seluruh laporan, verifikasi, penerimaan, volume layak tagih dan tagihan? Master data dan pengguna tetap.")) return;
        ["dailies", "progress", "manpower", "materials", "photos", "qc", "hsse", "issues",
          "verifications", "acceptances", "billables", "billings", "documents", "meetings", "actions"].forEach(k => DB[k] = []);
        audit("DELETE", "ALL_TRANSACTION", "-", "", "wipe");
        save(); toast("Data transaksi dibersihkan.", "ok"); render();
      };
    }
  }
};

VIEWS.audit = {
  html() {
    return `<div class="card"><h3>Jejak perubahan
      <span class="row tight"><span class="tiny muted">${DB.audit.length} baris tersimpan</span>
      <button class="btn sm" id="auCsv">Unduh CSV</button>
      ${can("settings") ? `<button class="btn d sm" id="auClr">Hapus riwayat</button>` : ""}</span></h3>
      <div class="body flush"><div class="tw"><table>
      <thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Tabel</th><th>Record</th><th>Nilai baru</th><th>Alasan</th></tr></thead>
      <tbody>${DB.audit.length ? DB.audit.slice(0, 300).map(a => `<tr>
        <td class="num tiny">${esc(a.timestamp.slice(0, 16).replace("T", " "))}</td>
        <td class="tiny">${esc(a.user_name)}</td><td><span class="b gray">${esc(a.action)}</span></td>
        <td class="tiny">${esc(a.table_name)}</td><td class="tiny">${esc(a.record_id)}</td>
        <td class="tiny">${esc(a.new_value)}</td><td class="tiny">${esc(a.reason)}</td></tr>`).join("")
      : `<tr><td colspan="7"><div class="empty">Belum ada aktivitas tercatat.</div></td></tr>`}
      </tbody></table></div></div></div>`;
  },
  bind() {
    if ($("#auClr")) $("#auClr").onclick = () => {
      if (!confirmBox("Hapus seluruh riwayat audit? Unduh CSV dulu bila perlu arsip. Tindakan ini sendiri akan dicatat sebagai baris pertama yang baru.")) return;
      const n = DB.audit.length;
      DB.audit = [];
      audit("DELETE", "27_AUDIT_LOG", "-", n + " baris", "riwayat dibersihkan", "Pembersihan riwayat oleh " + S.user.user_name);
      save(); toast("Riwayat audit dibersihkan.", "ok"); render();
    };
    $("#auCsv").onclick = () => csvDownload("AUDIT_" + today() + ".csv",
      [["timestamp", "user", "action", "table", "record", "old", "new", "reason"]]
        .concat(DB.audit.map(a => [a.timestamp, a.user_name, a.action, a.table_name, a.record_id, a.old_value, a.new_value, a.reason])));
  }
};

/* ============================================================
   VIEW: SINKRONISASI (panel ringkas)
   Untuk peran selain Project Control. Isinya hanya yang diperlukan
   supaya data perangkat ini menyatu dengan kantor: kata sandi,
   tombol sinkron, dan pemeriksaan. Tidak ada pengaturan proyek,
   daftar pengguna, maupun PIN di sini.
   ============================================================ */
VIEWS.sync = {
  html() {
    const sy = DB.config.sync || {};
    const jml = SYNC_TABLES.reduce((a, t) => a + (DB[t] || []).length, 0);
    const antre = DB.photos.filter(f => String(f.file_url || "").indexOf("data:") === 0).length;
    const siap = syncSiap();
    return `<div class="card"><div class="body">
      <div class="note">Data yang Anda isi tersimpan lebih dulu di perangkat ini, lalu dikirim ke kantor saat
        tombol <b>Sinkronkan sekarang</b> ditekan.</div>

      ${siap ? `
      <div class="note ok mt12"><b>Perangkat ini sudah tersambung ke kantor.</b>
        Kata sandi dan alamat kantor disembunyikan supaya tidak bisa diubah orang lain
        yang kebetulan memakai perangkat ini. Bila memang perlu diganti, tekan
        <b>Ubah sambungan</b> dan masukkan PIN Project Control.</div>`
      : `
      <div class="note warn mt12"><b>Perangkat ini belum tersambung.</b> Isian Anda tersimpan di perangkat
        tetapi <b>tidak akan pernah sampai</b> ke kantor sampai kata sandi diisi. Minta kepada Project Control HBM.
        <div class="fg c1 mt12"><label class="f"><span>Kata sandi sinkronisasi</span>
          <input type="password" id="spTok" value="" placeholder="minta ke Project Control HBM"></label></div>
      </div>`}

      <div class="chk mt12"><input type="checkbox" id="spAuto" ${sy.auto ? "checked" : ""}>
        <label for="spAuto">Sinkronkan sendiri setiap 5 menit selama aplikasi terbuka</label></div>

      <div class="row mt12">
        <button class="btn p" id="spGo">Sinkronkan sekarang</button>
        <button class="btn" id="spPeriksa">Periksa sinkron</button>
        ${siap ? `<button class="btn" id="spUbah">Ubah sambungan</button>`
                : `<button class="btn" id="spSave">Simpan kata sandi</button>`}
      </div>
      <div id="spMsg" class="mt12"></div>

      <div class="grid g4 mt16">
        <div class="kpi"><div class="eyebrow">Baris data di perangkat ini</div><div class="v">${fmt0(jml)}</div><div class="sub">siap dikirim</div></div>
        <div class="kpi ${antre ? "amber" : ""}"><div class="eyebrow">Foto belum diunggah</div><div class="v">${antre}</div><div class="sub">masih di perangkat ini</div></div>
        <div class="kpi teal"><div class="eyebrow">Sinkron terakhir</div><div class="v" style="font-size:15px">${sy.last ? esc(sy.last.slice(0, 16).replace("T", " ")) : "belum pernah"}</div><div class="sub">waktu perangkat</div></div>
        <div class="kpi ${siap ? "teal" : "red"}"><div class="eyebrow">Status</div><div class="v" style="font-size:15px">${siap ? "Tersambung" : "Belum diatur"}</div><div class="sub">${navigator.onLine ? "perangkat online" : "perangkat offline"}</div></div>
      </div>

      <div class="note warn mt16"><b>Kebiasaan harian.</b> Tekan Sinkronkan sekali sebelum mulai bekerja, dan
        sekali lagi setelah laporan selesai diisi. Bila terasa ada yang tidak cocok dengan kantor, tekan
        <b>Periksa sinkron</b> lalu <b>Salin hasil</b> dan kirimkan ke Project Control.</div>
    </div></div>`;
  },
  bind() {
    const c = DB.config;
    const kabar = (m, jenis) => { $("#spMsg").innerHTML = `<div class="note ${jenis || ""}">${esc(m)}</div>`; };
    const ambil = () => {
      c.sync = c.sync || {};
      /* Kolom kata sandi hanya ada saat perangkat belum tersambung. Sesudah
         tersambung, kata sandi yang tersimpan tidak boleh tertimpa kosong. */
      const kolom = $("#spTok");
      if (kolom) c.sync.token = kolom.value.trim();
      c.sync.auto = $("#spAuto").checked;
      if (!c.sync.url && SYNC_BAWAAN.url) c.sync.url = SYNC_BAWAAN.url;
    };
    const sibuk = t => { ["spGo", "spPeriksa", "spSave", "spUbah"].forEach(i => { if ($("#" + i)) $("#" + i).disabled = t; }); };

    if ($("#spSave")) $("#spSave").onclick = () => {
      ambil(); save(); aturAutoSync();
      audit("UPDATE", "26_SYSTEM_CONFIG", "sync", "", c.sync.token ? "kata sandi diisi" : "kata sandi dikosongkan");
      render(); kabar("Kata sandi tersimpan di perangkat ini.", "");
    };

    /* Mengubah sambungan hanya boleh oleh pemegang PIN Project Control.
       Ini menutup celah orang lain mengutak-atik perangkat Admin Site. */
    if ($("#spUbah")) $("#spUbah").onclick = () => {
      const pin = prompt("Mengubah sambungan hanya boleh oleh Project Control.\nMasukkan PIN Project Control:");
      if (pin === null) return;
      const pc = DB.users.find(u => u.role === "PROJECT_CONTROL" && u.active !== false && String(u.pin) === String(pin).trim());
      if (!pc) {
        audit("UPDATE", "26_SYSTEM_CONFIG", "sync", "", "percobaan ubah sambungan dengan PIN salah");
        save();
        return kabar("PIN tidak cocok. Percobaan ini dicatat di Log Audit.", "stop");
      }
      c.sync = c.sync || {}; c.sync.token = ""; save();
      audit("UPDATE", "26_SYSTEM_CONFIG", "sync", "", "sambungan dibuka untuk diubah oleh " + pc.user_name);
      render();
      kabar("Sambungan dibuka. Isi kata sandi baru lalu tekan Simpan kata sandi.", "warn");
    };
    $("#spPeriksa").onclick = () => { ambil(); save(); bukaPeriksaSinkron(); };
    $("#spGo").onclick = async () => {
      ambil(); save();
      if (!syncSiap()) return kabar("Isi kata sandi sinkronisasi lebih dulu. Mintalah kepada Project Control HBM.", "stop");
      sibuk(true);
      const r = await syncNow(m => kabar(m));
      sibuk(false);
      if (r.ok) { toast("Sinkronisasi selesai.", "ok"); render(); kabar(r.pesan, ""); }
      else kabar(r.pesan, "stop");
    };
  }
};

const GUARD = {
  dashboard: ["dash"], "tanks-status": ["dash"],
  "daily-new": ["daily_input"], "daily-list": ["daily_input", "daily_all"],
  review: ["review"], acceptance: ["accept"], billable: ["billable"],
  billing: ["billing", "billing_view"], documents: ["documents"],
  issues: ["issues", "issues_view"], meeting: ["meeting"], reports: ["reports"],
  master: ["master"], settings: ["settings"], audit: ["audit"], sync: ["sync_panel"],
  pesan: ["pesan"]
};
Object.keys(GUARD).forEach(k => {
  const v = VIEWS[k]; if (!v) return;
  const h = v.html, b = v.bind, perms = GUARD[k];
  const allowed = () => perms.some(can);
  v.html = function () {
    return allowed() ? h.call(v)
      : `<div class="card"><div class="empty"><b>Akses ditolak</b>Peran ${esc(ROLE_LABEL[S.user.role])} tidak memiliki izin untuk halaman ini.</div></div>`;
  };
  v.bind = function () { if (allowed() && b) b.call(v); };
});
